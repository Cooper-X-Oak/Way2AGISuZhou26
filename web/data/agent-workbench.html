<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>铺市 Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: task list | conversation | artifacts. One sans family, five sizes, colour only for meaning. */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --sunken:#eef2f3;
  --ink:#16242b; --ink-2:#44555d; --muted:#66767d; --line:#e1e7e9; --line-strong:#cdd6d9;
  --primary:#0b6a88; --primary-ink:#ffffff; --primary-soft:#e3f1f6;
  --found:#b5600a; --found-soft:#fbeedd;
  --danger:#b3372f; --danger-soft:#fbe7e5;
  --ok:#2b7a4b; --ok-soft:#e3f2e9;
  --idle:#8a979c; --dot:#c3cdd1;
  --font:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,ui-monospace,monospace;
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-lg:16px; --t-xl:20px;
  --r-sm:6px; --r-lg:12px; --h-sm:28px; --h-md:36px;
  --shadow:0 1px 2px rgba(16,36,43,.06),0 8px 24px rgba(16,36,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#152127; --sunken:#1b2a31;
  --ink:#e6edf0; --ink-2:#b8c6cc; --muted:#93a3aa; --line:#24343b; --line-strong:#35484f;
  --primary:#2b8fb0; --primary-ink:#ffffff; --primary-soft:#173847;
  --found:#f0a24a; --found-soft:#3a2b18;
  --danger:#ec7b72; --danger-soft:#3b2120;
  --ok:#6cc391; --ok-soft:#183427;
  --idle:#7f9097; --dot:#3d525a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#152127; --sunken:#1b2a31;
  --ink:#e6edf0; --ink-2:#b8c6cc; --muted:#93a3aa; --line:#24343b; --line-strong:#35484f;
  --primary:#2b8fb0; --primary-ink:#ffffff; --primary-soft:#173847;
  --found:#f0a24a; --found-soft:#3a2b18;
  --danger:#ec7b72; --danger-soft:#3b2120;
  --ok:#6cc391; --ok-soft:#183427;
  --idle:#7f9097; --dot:#3d525a; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100dvh;overflow:hidden}
html{height:100dvh}
body{background:var(--bg);color:var(--ink);font:var(--t-md)/1.6 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3,p{margin:0}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.small{font-size:var(--t-xs);color:var(--muted)}
.muted{color:var(--muted)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

.app{max-width:1600px;height:calc(100dvh - 32px);margin:0 auto;display:grid;grid-template-columns:clamp(220px,17vw,264px) minmax(0,1fr);gap:24px}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.brand{display:grid;gap:2px;padding:4px 10px 0}
.brand b{font-size:var(--t-lg);font-weight:600;letter-spacing:.01em}
.newbtn{height:var(--h-md);border:1px solid var(--primary);color:var(--primary);border-radius:var(--r-sm);font-weight:600;font-size:var(--t-sm);display:flex;align-items:center;gap:6px;padding:0 12px}
.newbtn:hover{background:var(--primary-soft)}
.list-h{padding:6px 10px 0}
.tasks{list-style:none;margin:0;padding:0;overflow:auto;overscroll-behavior:contain;display:grid;gap:2px;align-content:start;min-height:0}
.task{width:100%;text-align:left;border-radius:var(--r-sm);padding:9px 10px 9px 13px;display:grid;gap:3px;position:relative}
.task:hover{background:var(--sunken)}
.task[aria-current="true"]{background:var(--sunken)}
.task[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--primary)}
.task .t{font-size:var(--t-md);font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .m{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--muted);min-width:0}
.task .m span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:500;white-space:nowrap;flex:none}
.chip.draft{border:1px solid var(--line-strong);color:var(--muted)}
.chip.queued{background:var(--sunken);color:var(--idle)}
.chip.running{background:var(--primary-soft);color:var(--primary)}
.chip.ask{background:var(--found-soft);color:var(--found)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.stop{background:var(--danger-soft);color:var(--danger)}
.chip.fail{background:var(--danger);color:#fff}
.pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px;min-height:0;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
.head h1{font-size:var(--t-xl);font-weight:600;line-height:1.35;min-width:0}
.head h1 .sep{color:var(--idle);font-weight:400;margin:0 6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--t-sm);color:var(--muted)}

/* progress rail */
.rail{list-style:none;margin:0;padding:0;display:flex;gap:4px;height:44px;min-height:44px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.node{position:relative;display:flex;flex:1 0 auto;align-items:center;justify-content:center;gap:6px;padding:0 10px;height:40px;white-space:nowrap;cursor:pointer;border-radius:var(--r-sm)}
.node:hover{background:var(--sunken)}
.node::before{display:none}
.node:first-child::before{display:none}
.node.passed::before{background:var(--ok)}
.dotn{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0;margin-top:0}
.node.done .dotn{background:var(--ok);border-color:var(--ok)}
.node.done .dotn::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.node.run .dotn{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);animation:ring 1.8s ease-in-out infinite}
.node.agent.run .dotn{background:var(--found);border-color:var(--found);box-shadow:0 0 0 4px var(--found-soft)}
.node.ask .dotn{background:var(--found);border-color:var(--found)}
.node.ask .dotn::after,.node.stop .dotn::after{content:"!"}
.node.stop .dotn{background:var(--danger);border-color:var(--danger)}
@keyframes ring{50%{box-shadow:0 0 0 7px transparent}}
.node .nm{font-size:var(--t-sm);color:var(--idle);white-space:nowrap}
.node.done .nm,.node.run .nm,.node.ask .nm,.node.stop .nm{color:var(--ink)}
.node.run .nm{font-weight:600}
.node .ag{font-size:10px;color:var(--found);font-weight:600;margin-left:3px;letter-spacing:.04em}
.node .sm{font-size:var(--t-xs);color:var(--muted);line-height:1.35;max-width:120px}
.node.sel .nm{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.card-h h2{font-size:var(--t-lg);font-weight:600}
.linkbtn{color:var(--primary);font-size:var(--t-sm)}
.linkbtn:hover{text-decoration:underline}

/* ---------- conversation ---------- */
.livebar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary-soft);color:var(--primary);font-size:var(--t-sm);border-bottom:1px solid var(--line)}
.livebar b{font-weight:600}
.thread{flex:1;overflow:auto;overscroll-behavior:contain;padding:18px 16px 8px;display:grid;gap:18px;align-content:start;min-height:0}
.msg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.av.u{background:var(--ink);color:var(--surface)}
.av.a{background:var(--primary);color:#fff}
.av.s{background:var(--sunken);color:var(--muted)}
.av svg{width:14px;height:14px}
.mb{display:grid;gap:6px;min-width:0}
.who{display:flex;align-items:baseline;gap:8px;font-size:var(--t-xs);color:var(--muted)}
.who b{font-size:var(--t-sm);font-weight:600;color:var(--ink)}
.bubble{background:var(--sunken);border-radius:var(--r-sm) var(--r-lg) var(--r-lg) var(--r-lg);padding:9px 12px;justify-self:start;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.prose{display:grid;gap:6px}
.prose ul{margin:0;padding-left:18px}
.callout{border-left:3px solid var(--found);padding:4px 0 4px 12px;display:grid;gap:8px}
.callout.stop{border-color:var(--danger)}
.answers{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:var(--h-sm);padding:0 12px;border-radius:999px;background:var(--sunken);font-size:var(--t-sm);white-space:nowrap}
.pill:hover{background:var(--primary-soft);color:var(--primary)}
.pill.primary{background:var(--primary);color:var(--primary-ink)}
.links{display:flex;flex-wrap:wrap;gap:4px 14px}

/* execution timeline */
details.run{border-radius:var(--r-sm)}
details.run>summary{list-style:none;cursor:pointer;font-size:var(--t-sm);color:var(--muted);display:flex;align-items:center;gap:6px}
details.run>summary::-webkit-details-marker{display:none}
details.run>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.run[open]>summary::before{transform:rotate(45deg)}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px}
.tl li{position:relative;display:grid;gap:3px;animation:fade .25s ease both}
.msg.still,.tl li.still{animation:none}
.tl li::before{content:"";position:absolute;left:-19px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.tl li.m::before{background:var(--primary)}
.tl li.t::before{background:var(--found)}
.tl li.r::before{background:var(--danger)}
.tl .h{font-size:var(--t-sm);font-weight:600}
.tl .note{font-size:var(--t-sm);color:var(--ink-2);font-style:italic;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.tl .note.open{-webkit-line-clamp:unset}
.args{display:flex;flex-wrap:wrap;gap:4px}
.arg{font-size:var(--t-xs);background:var(--sunken);border-radius:4px;padding:1px 6px;overflow-wrap:anywhere}
.arg i{font-style:normal;color:var(--muted);margin-right:4px}
.res{font-size:var(--t-sm);color:var(--ink-2)}
.res .num{color:var(--found)}
.res.err{color:var(--danger)}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--idle);animation:pulse 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* composer */
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px;position:relative}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.quick::-webkit-scrollbar{display:none}
.quick .lab{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;margin-right:2px}
.pickers{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--t-sm)}
.pickers select{height:var(--h-sm);border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 8px}
.box{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--surface);padding:6px 6px 6px 12px}
.box:focus-within{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.box textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;line-height:1.5;padding:4px 0;max-height:120px;font-size:var(--t-md)}
.ibtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--sunken);color:var(--ink)}
.ibtn[aria-expanded="true"]{color:var(--primary);background:var(--primary-soft)}
.ibtn svg{width:18px;height:18px}
.send{background:var(--primary);color:var(--primary-ink)}
.send:hover{background:var(--primary);color:var(--primary-ink);filter:brightness(1.08)}
.send:disabled{background:var(--sunken);color:var(--idle);cursor:not-allowed;filter:none}
.hint{font-size:var(--t-xs);color:var(--muted)}
.toolbox{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(10,30,40,.18);max-height:360px;overflow:auto;padding:8px;z-index:5}
.tb-g{padding:6px 6px 8px}
.tb-g h3{font-size:var(--t-xs);color:var(--muted);font-weight:500;margin-bottom:4px}
.tb-i{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:var(--r-sm);font-size:var(--t-sm)}
.tb-i:hover,.tb-i.on{background:var(--sunken)}

/* ---------- artifacts ---------- */
.seg{display:flex;min-width:0;overflow-x:auto;scrollbar-width:none;background:var(--sunken);border-radius:var(--r-sm);padding:2px}
.seg button{flex-shrink:0;white-space:nowrap;height:28px;padding:0 12px;border-radius:5px;font-size:var(--t-sm);color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-height:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:var(--t-sm);color:var(--ink-2);align-items:baseline}
.counts .num{font-size:var(--t-lg);color:var(--ink);margin-left:4px}
.counts .found .num{color:var(--found)}
.legend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 14px;font-size:var(--t-xs);color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mapwrap{position:relative;width:100%;max-width:min(100%,60vh,560px);margin:0 auto;aspect-ratio:1}
.mapwrap svg{width:100%;height:100%;display:block}
.mapnote{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mapnote span{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:var(--t-sm);color:var(--muted)}
.m-ring{fill:none;stroke:var(--line-strong);stroke-width:20}
.m-ring.tbd{stroke-dasharray:80 60}
.m-grid{stroke:var(--line);stroke-width:8}
.m-base{fill:var(--dot)}
.m-found{fill:var(--found)}
.m-zone{fill:var(--primary-soft);stroke:var(--primary);stroke-width:20}
.m-term{fill:none;stroke:var(--primary);stroke-width:18}
.m-term.A{stroke:var(--ink);stroke-width:24}
.m-ctr{fill:var(--ink)}
.m-lab{fill:var(--muted);font:150px var(--font)}

.dec{list-style:none;margin:0;padding:0}
.dec li{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.dec li:first-child{border-top:0;padding-top:0}
.dec li.hl{background:linear-gradient(90deg,var(--primary-soft),transparent 70%);margin:0 -16px;padding-left:16px;padding-right:16px}
.dec .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.dec .id{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);width:34px}
.dec .nm{font-weight:600}
.src{font-size:var(--t-xs);color:var(--muted)}
.src.llm{color:var(--found);font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--t-xs);color:var(--muted)}
.checks span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--ok)}
.checks .needs_review::before{background:var(--found)}
.checks .failed::before,.checks .blocked::before{background:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:var(--t-xs);font-weight:500;color:var(--muted);white-space:nowrap}
.grade{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 12px var(--mono)}
.grade.A{background:var(--ink);color:var(--surface)}
.grade.B{background:var(--line-strong);color:var(--ink)}
.grade.C{border:1px solid var(--line-strong);color:var(--muted)}
tr.C td{color:var(--muted)}
.tagf{font-size:var(--t-xs);color:var(--found);margin-left:6px;white-space:nowrap}
.nowrap{white-space:nowrap}
.pitch{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.pitch:first-child{border-top:0;padding-top:0}
.pitch h3{font-size:var(--t-sm);font-weight:600;display:flex;gap:8px;align-items:baseline}
.pitch p{line-height:1.75;max-width:62ch;color:var(--ink-2)}
.ok{color:var(--ok);font-size:var(--t-xs);font-weight:500}
.empty{display:grid;justify-items:center;gap:8px;padding:48px 16px;color:var(--muted);font-size:var(--t-sm);text-align:center}
.empty svg{width:24px;height:24px;color:var(--idle)}
.boundary{font-size:var(--t-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:grid;gap:2px}

/* new task */
.welcome{display:grid;gap:14px;padding:24px 4px}
.welcome h3{font-size:var(--t-lg);font-weight:600}
.examples{display:grid;gap:6px}
.example{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--t-sm);color:var(--ink-2)}
.example:hover{border-color:var(--primary);color:var(--ink)}

.mobtabs{display:none}
.app{grid-template-rows:minmax(0,1fr);overflow:hidden}
.card-h,.composer,.livebar{flex:none}
@media (max-width:1180px){
  .main{grid-template-rows:auto auto auto minmax(0,1fr)}
  .mobtabs{display:flex;gap:8px}.mobtabs button{padding:4px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
  .mobtabs button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary)}
  .panes{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .panes .card.art{display:none}
  .panes[data-show="art"]>.card:first-child{display:none}
  .panes[data-show="art"]>.card.art{display:flex}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:72px minmax(0,1fr);gap:12px}
  .side{display:grid;grid-template-columns:auto 1fr;align-items:center}
  .side .brand,.side .list-h{display:none}
  body.public-demo .app{grid-template-rows:108px minmax(0,1fr)}
  body.public-demo .side{grid-template-columns:1fr 1fr;grid-template-rows:36px minmax(0,1fr)}
  body.public-demo .tasks{grid-column:1/-1}
  .tasks{grid-auto-flow:column;grid-auto-columns:minmax(200px,70vw);overflow-x:auto}
  .node{flex:0 0 auto}
}
/* ---------- hero (entry) : always dark, a stage rather than a tool ---------- */
.hero{--h-bg:#050d11;--h-ink:#e9f4f7;--h-2:#a9bec5;--h-mut:#6f8890;--h-cy:#4fd1e6;--h-or:#ff9f43;--h-line:rgba(110,190,210,.16);

.hero.leaving{opacity:0;transform:scale(1.06);pointer-events:none}
.hero canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hero .veil{position:fixed;inset:0;background:linear-gradient(90deg,rgba(5,13,17,.92) 0%,rgba(5,13,17,.65) 38%,rgba(5,13,17,0) 62%);pointer-events:none}
.hero .wrap{position:relative;min-height:100%;max-width:1440px;margin:0 auto;padding:28px max(24px,4vw);display:flex;flex-direction:column;gap:20px}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;font-size:var(--t-lg)}
.hero .logo i{width:22px;height:22px;border-radius:50%;border:2px solid var(--h-cy);position:relative;box-shadow:0 0 16px rgba(79,209,230,.5)}
.hero .logo i::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--h-or)}
.hero .hist{font-size:var(--t-sm);color:var(--h-2);border:1px solid var(--h-line);border-radius:999px;padding:6px 14px;transition:border-color .2s,color .2s}
.hero .hist:hover{color:var(--h-ink);border-color:var(--h-cy)}
.hero .copy{margin:auto 0;max-width:600px;display:flex;flex-direction:column;gap:22px}
.hero .kick{font:600 var(--t-xs)/1 var(--mono);letter-spacing:.18em;color:var(--h-cy);display:flex;align-items:center;gap:10px}
.hero .kick::before{content:"";width:28px;height:1px;background:var(--h-cy)}
.hero h1{font-size:clamp(34px,4.6vw,60px);line-height:1.12;font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--h-cy),var(--h-or));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:var(--t-lg);line-height:1.75;color:var(--h-2);max-width:34em}
.hero .flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--h-mut)}
.hero .flow span{padding:3px 10px;border-radius:999px;border:1px solid transparent;transition:all .35s}
.hero .flow span.on{color:var(--h-ink);border-color:var(--h-cy);background:rgba(79,209,230,.12);box-shadow:0 0 18px rgba(79,209,230,.25)}
.hero .flow b{font-weight:400;opacity:.5}
.hero form{display:flex;flex-direction:column;gap:10px}
.hero .pick{display:flex;flex-wrap:wrap;gap:8px;font-size:var(--t-sm);color:var(--h-mut)}
.hero .pick label{display:flex;align-items:center;gap:6px}
.hero .pick select,.hero .pick .fixed{background:rgba(255,255,255,.06);border:1px solid var(--h-line);border-radius:999px;padding:4px 12px;color:var(--h-ink);font-size:var(--t-sm)}
.hero .pick select option{background:#0b1a20}
.hero .field{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-radius:16px;background:rgba(8,24,30,.75);border:1px solid rgba(79,209,230,.35);
  box-shadow:0 0 0 6px rgba(79,209,230,.06),0 20px 60px rgba(0,0,0,.45);backdrop-filter:blur(8px);transition:border-color .2s,box-shadow .2s}
.hero .field:focus-within{border-color:var(--h-cy);box-shadow:0 0 0 6px rgba(79,209,230,.14),0 20px 60px rgba(0,0,0,.45)}
.hero .field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:var(--t-lg);color:var(--h-ink);height:44px}
.hero .field input::placeholder{color:var(--h-mut)}
.hero .go{height:44px;padding:0 20px;border-radius:12px;background:linear-gradient(135deg,#2fb6cf,#1b8aa6);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:filter .2s,transform .1s}
.hero .go:hover{filter:brightness(1.12)}.hero .go:active{transform:scale(.97)}
.hero .go svg{width:16px;height:16px}
.hero .ex{display:flex;flex-wrap:wrap;gap:8px}
.hero .ex button{font-size:var(--t-xs);color:var(--h-2);border:1px dashed var(--h-line);border-radius:999px;padding:4px 12px;transition:all .2s;text-align:left}
.hero .ex button:hover{color:var(--h-ink);border-color:var(--h-cy);border-style:solid}
.hero .warn{font-size:var(--t-sm);color:#ffc58a;background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.35);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.hero .warn button{color:var(--h-cy);text-decoration:underline;text-underline-offset:3px}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero .play{display:inline-flex;align-items:center;gap:12px;font-weight:600;color:var(--h-ink);text-align:left;line-height:1.4}
.hero .play i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--h-or);color:var(--h-or);box-shadow:0 0 18px rgba(255,159,67,.35);transition:transform .2s}
.hero .play:hover i{transform:scale(1.08)}
.hero .play small{font-weight:400;color:var(--h-mut);font-size:var(--t-xs)}
.hero .stats{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;padding-top:14px;border-top:1px solid var(--h-line)}
.hero .stat b{display:block;font:700 28px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.hero .stat span{font-size:var(--t-xs);color:var(--h-mut)}
.hero .stat.or b{color:var(--h-or)}.hero .stat.cy b{color:var(--h-cy)}
.hero .stats .src{font-size:var(--t-xs);color:var(--h-mut);margin-left:auto;align-self:flex-end}
.hero .hud{position:absolute;right:max(24px,4vw);bottom:28px;width:min(380px,34vw);font:var(--t-xs)/1.7 var(--mono);color:var(--h-2);
  background:rgba(5,15,19,.72);border:1px solid var(--h-line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px)}
.hero .hud h4{margin:0 0 6px;font-weight:600;color:var(--h-cy);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.hero .hud h4 .pulse{background:var(--h-or)}
.hero .hud ol{list-style:none;margin:0;padding:0;min-height:calc(1.7em * 5)}
.hero .hud li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:hudIn .4s ease both}
.hero .hud li:not(:last-child){opacity:.55}
.hero .hud li .k{color:var(--h-or)}
@keyframes hudIn{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hero .reveal{animation:heroIn .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.app.enter{animation:heroIn .6s cubic-bezier(.2,.7,.2,1) both}
.brand{cursor:pointer}
@media (max-height:820px) and (min-width:901px){
  .hero .wrap{padding-block:18px;gap:12px}.hero .copy{gap:14px}
  .hero h1{font-size:clamp(30px,3.6vw,46px)}.hero .lead{font-size:var(--t-md)}

}

function groupTaskRecords(rows){
  const by=new Map(rows.map(r=>[r.run_id,r])),out=new Map();
  for(const r of rows){let root=r;const seen=new Set([r.run_id]);
    while(root.task?.parent_id&&by.has(root.task.parent_id)&&!seen.has(root.task.parent_id)){root=by.get(root.task.parent_id);seen.add(root.run_id);}
    if(!out.has(root.run_id))out.set(root.run_id,{root,rows:[]});out.get(root.run_id).rows.push(r);}
  return [...out.values()].map(({root,rows})=>{rows.sort((a,b)=>a.task.created_at.localeCompare(b.task.created_at));return {root,latest:rows.at(-1),ids:rows.map(r=>r.run_id)};})
    .sort((a,b)=>b.latest.task.created_at.localeCompare(a.latest.task.created_at));
}

function markdown(text){
 const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  return s.replace(/\u0000(\d+)\u0000/g,(_,n)=>codes[+n]);};
 const lines=String(text||'').replaceAll('<｜end▁of▁sentence｜>','').replace(/\r\n/g,'\n').split('\n'),out=[];let i=0;
 const cells=line=>line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
 while(i<lines.length){const l=lines[i];if(!l.trim()){i++;continue;}
  if(/^\s*```/.test(l)){const code=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))code.push(lines[i++]);i++;out.push('<pre><code>'+escape(code.join('\n'))+'</code></pre>');continue;}
  const h=l.match(/^(#{1,6})\s+(.+)$/);if(h){out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
  if(/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(l)){out.push('<hr>');i++;continue;}
  if(i+1<lines.length&&l.includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const head=cells(l);i+=2;const rows=[];while(i<lines.length&&lines[i].includes('|'))rows.push(cells(lines[i++]));out.push('<div class="md-table"><table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;}
  if(/^\s*>/.test(l)){const q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));out.push('<blockquote>'+markdown(q.join('\n'))+'</blockquote>');continue;}
  const list=l.match(/^(\s*)([-+*]|\d+[.)])\s+(.+)$/);
  if(list){const indent=list[1].length,tag=/\d/.test(list[2])?'ol':'ul',items=[];
   while(i<lines.length){const m=lines[i].match(/^(\s*)([-+*]|\d+[.)])\s+(.+)$/);if(!m||m[1].length!==indent||(/\d/.test(m[2])?'ol':'ul')!==tag)break;
    let body=inline(m[3]);i++;const nested=[];while(i<lines.length&&lines[i].trim()&&/^\s+/.test(lines[i])&&lines[i].match(/^\s*/)[0].length>indent)nested.push(lines[i++].slice(indent+2));if(nested.length)body+=markdown(nested.join('\n'));items.push('<li>'+body+'</li>');}
   out.push('<'+tag+'>'+items.join('')+'</'+tag+'>');continue;}
  const p=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^(?:#{1,6}\s|\s*```|\s*>|\s*[-+*]\s|\s*\d+[.)]\s)/.test(lines[i])){if(i+1<lines.length&&lines[i].includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1]))break;p.push(lines[i++]);}out.push('<p>'+p.map(inline).join('<br>')+'</p>');
 }return out.join('');
}

/* ================= render all ================= */
function render(){renderList();renderHead();renderRail();renderThread();renderComposer();renderArtifacts();}

/* ================= actions ================= */
function select(id){showPane('chat');clearTimeout(S.timer);stopReplay(false);S.cur=id;S.stage=null;S.tab='map';S._jump=true;
  const c=conv();if(!c?.draft&&S.online){render();poll();if(!c.offline&&!DONE(c.status)&&c.turns?.length)watchRun(c.turns.at(-1));}else render();
  if(!c?.draft){try{history.replaceState(null,'','#'+c.id);}catch{}}}
function newTask(){let d=S.convs.find(c=>c.draft&&!chatFor(c)&&!S.outbox[c.id]);if(!d){d={id:'draft-'+Date.now(),draft:true};S.convs.unshift(d);}select(d.id);$('ask').focus();}
async function send(text){
  text=text.trim();if(!text||text.startsWith('/'))return;
  if(S.sending)return;
  if(S.online&&conv()?.offline){newTask();}
  const c=conv();
  if(!S.online||!S.config?.live_ready){
    const reason=!S.online?'这是离线页面，没有连接 Agent 服务，这条指令没有执行。':`本地服务缺少实况配置（${(S.config?.missing||[]).join('、')}），这条指令没有执行。`;
    if(c&&!c.draft){(S.notices[c.id]=S.notices[c.id]||[]).push({text,reason});}
    else{alertDraft(reason);}
    S._jump=true;if(c&&!c.draft)render();return;
  }
  const origin=c.id;let accepted=false;
  S.outbox[origin]={text,status:'sending'};
  if(c.draft&&!c.title)c.title=text.slice(0,60);
  $('ask').value='';autosize();S._jump=true;
  S.sending=true;S.error='';renderList();renderComposer();renderThread();
  try{
    const body=taskRequestBody({conv:c,view:lastView(),text,profile:$('p-sel')?.value,area:$('a-sel')?.value});
    if(!c||c.draft)Object.assign(body,selectedLibrary());
    const existing=chatFor(c);if(existing){body.conversation_id=existing.data.conversation_id;body.profile=existing.profile;body.area=existing.area;body.library=existing.library;}
    const applyReply=async response=>{const run_id=response.run_id;
    accepted=true;delete S.outbox[origin];const viewing=S.cur===origin||S.cur===CHAT[response.conversation_id]?.root;
    const root=run_id?(c?.draft?run_id:c.id):(c?.draft?'chat-'+response.conversation_id:c.id);
    CHAT[response.conversation_id]={root,profile:body.profile,area:body.area,library:body.library,data:response};saveChats();
    if(viewing)S._jump=true;
    if(!run_id){if(c?.draft){c.id=root;c.title=c.title||text.slice(0,60);if(viewing)S.cur=root;}if(viewing)S.tab='document';render();return;}
    if(!c||c.draft){S.convs=S.convs.filter(x=>x!==c&&x.id!==origin);}
    await refreshList();
    const target=S.convs.find(x=>x.turns?.includes(run_id));
    S.views[run_id]={pending:true,status:'queued',task:{message:text}};
    if(viewing){select(target?target.id:run_id);S.tab='document';renderArtifacts();}else renderList();
    watchRun(run_id);
    };
    S.liveChat={root:origin,text:'',status:'正在连接模型'};
    const response=await streamChat(body,async event=>{
      if(event.type==='conversation'){
        CHAT[event.conversation_id]=CHAT[event.conversation_id]||{root:origin,profile:body.profile,area:body.area,library:body.library,data:{conversation_id:event.conversation_id,messages:[]}};saveChats();
      }
      if(event.type==='model_start'){S.liveChat.text='';S.liveChat.status='模型正在生成回复';}
      if(event.type==='text_delta')S.liveChat.text+=event.text;
      if(event.type==='operation'){
        await applyReply(event);S.liveChat.root=CHAT[event.conversation_id].root;S.liveChat.text='';S.liveChat.status=event.message;
      }
      renderThread();
    });
    await applyReply(response);
  }catch(e){if(!accepted)S.outbox[origin]={text,status:'failed',error:e.message};else S.error=e.message;render();}
  finally{S.liveChat=null;S.sending=false;renderComposer();renderThread();}
}
function alertDraft(reason){const th=$('thread');th.insertAdjacentHTML('beforeend',msg('s','系统','未执行',`<div class="callout stop"><p>${esc(reason)}</p></div>`));}
function fill(t){$('ask').value=t;S.toolbox=false;autosize();renderToolbox();$('ask').focus();}
function autosize(){const a=$('ask');a.style.height='auto';a.style.height=Math.min(a.scrollHeight,120)+'px';}
function stopReplay(r=true){if(S.replay){clearTimeout(S.replay.timer);S.replay=null;if(r)render();}}
function startReplay(){
  const id=lastId(),v=S.views[id];if(!v?.steps?.length)return;
  if(S.replay){stopReplay();return;}
  S.replay={id,k:0};S.tab='map';S._jump=true;render();
  const tick=()=>{if(!S.replay)return;S.replay.k++;S._jump=true;render();
    if(S.replay.k<v.steps.length)S.replay.timer=setTimeout(tick,reduced?0:(v.steps[S.replay.k-1]?.kind==='model'?1400:1000));
    else S.replay.timer=setTimeout(()=>{S.replay=null;render();},reduced?0:900);};
  S.replay.timer=setTimeout(tick,reduced?0:600);
}

/* ================= events ================= */
function showPane(name){document.querySelector('.panes').dataset.show=name;document.querySelectorAll('[data-pane]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pane===name)));}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-pane],[data-fill],[data-tab],.task,.node,#newbtn,#quickstart,#replay,#tb,.note');
  if(!t){if(S.toolbox&&!e.target.closest('#toolbox')){S.toolbox=false;renderToolbox();}return;}
  if(t.matches('.note')){t.classList.toggle('open');return;}
  if(t.dataset.fill!=null)return fill(t.dataset.fill);
  if(t.dataset.pane)return showPane(t.dataset.pane);
  if(t.dataset.tab){showPane('art');S.tab=t.dataset.tab;renderArtifacts();return;}
  if(t.matches('.task'))return select(t.dataset.id);
  if(t.matches('.node')){showPane('art');S.stage=t.dataset.stage;S.tab=S.stage==='L0'?'brief':'dec';renderRail();renderComposer();renderArtifacts();return;}
  if(t.id==='newbtn')return newTask();
  if(t.id==='quickstart'){if(S.sending)return;newTask();return send(TEMPLATES(picked())[0]);}
  if(t.id==='replay')return startReplay();
  if(t.id==='tb'){S.toolbox=!S.toolbox;S.tbIndex=-1;renderToolbox();}
});
document.addEventListener('keydown',e=>{if(e.target.matches('.node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}});
$('composer').addEventListener('submit',e=>{e.preventDefault();send($('ask').value);});
$('ask').addEventListener('input',()=>{autosize();const v=$('ask').value;if(v.startsWith('/')){S.toolbox=true;S.tbIndex=0;}else if(S.toolbox&&!v)S.toolbox=false;renderToolbox();});
$('ask').addEventListener('keydown',e=>{
  if(S.toolbox){const items=[...document.querySelectorAll('.tb-i')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.tbIndex=(S.tbIndex+(e.key==='ArrowDown'?1:-1)+items.length)%Math.max(items.length,1);renderToolbox();return;}
    if(e.key==='Enter'&&items[S.tbIndex]){e.preventDefault();fill(items[S.tbIndex].dataset.fill);return;}
    if(e.key==='Escape'){S.toolbox=false;renderToolbox();return;}}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit();}
});

 ${libKind==='products'?`<label>产品事实、卖点与背景<textarea name="facts" required maxlength="6000" rows="5">${esc(x.facts||'')}</textarea></label><label>资料来源<input name="source" required maxlength="500" value="${esc(x.source||'用户提供')}"></label>`:''}

 ${libKind==='skills'?`<label>执行指引<textarea name="instructions" required maxlength="4000" rows="5">${esc(x.instructions||'')}</textarea></label><fieldset><legend>适用环节</legend>${STAGES.map(([id,n])=>`<label><input type="checkbox" name="stages" value="${id}" ${(x.stages||['L1D']).includes(id)?'checked':''}>${esc(n)}</label>`).join('')}</fieldset><label><input type="checkbox" name="enabled" ${x.enabled?'checked':''}> 新任务默认启用</label>`:''}
 <button type="submit" class="newbtn">保存到我的资料</button></form>`;
 $('lib-editor').scrollIntoView({block:'nearest'});
}
function saveLibrary(){localStorage.setItem('way2agi-library-v1',JSON.stringify(LIB));$('pickers').innerHTML='';renderComposer();renderThread();}
$('library-dialog').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.id==='library-close')return $('library-dialog').close();
 if(t.hasAttribute('data-lib-new'))return editLibrary(null);
 if(t.dataset.libEdit)return editLibrary(t.dataset.libEdit);
 if(t.dataset.libDelete){const before=LIB[libKind];LIB[libKind]=before.filter(x=>x.id!==t.dataset.libDelete);try{saveLibrary();renderLibrary();}catch{LIB[libKind]=before;$('lib-status').textContent='浏览器存储空间不足，未保存。';}}
});
$('library-dialog').addEventListener('change',e=>{if(e.target.dataset.libEnable){const x=LIB.skills.find(x=>x.id===e.target.dataset.libEnable),old=x.enabled;x.enabled=e.target.checked;try{saveLibrary();}catch{x.enabled=old;e.target.checked=old;$('lib-status').textContent='未能保存设置。';}}});
$('library-dialog').addEventListener('submit',e=>{
 e.preventDefault();const f=new FormData(e.target),x={id:editId||'personal-'+crypto.randomUUID(),name:String(f.get('name')).trim()};
 if(libKind==='products')Object.assign(x,{base:f.get('base'),facts:String(f.get('facts')).trim(),source:String(f.get('source')).trim()});
 if(libKind==='areas')Object.assign(x,{base:f.get('base'),radius_m:Number(f.get('radius_m'))});
 if(libKind==='skills'){Object.assign(x,{instructions:String(f.get('instructions')).trim(),stages:f.getAll('stages'),enabled:f.has('enabled')});if(!x.stages.length){$('lib-status').textContent='请选择至少一个适用环节。';return;}}
 const old=LIB[libKind];LIB[libKind]=[...old.filter(y=>y.id!==x.id),x];try{saveLibrary();renderLibrary();$('lib-status').textContent='已保存。新建任务时可选择。';}catch{LIB[libKind]=old;$('lib-status').textContent='浏览器存储空间不足，未保存。';}
});
document.querySelectorAll('[data-library]').forEach(b=>b.addEventListener('click',()=>openLibrary(b.dataset.library)));

/* ================= hero (entry screen) ================= */
const H={view:null,conv:null,raf:0,t0:0,log:[],logTimer:0,flowTimer:0,pts:null};
const FLOW=[['L1','卖给谁'],['L1D','找终端'],['L2','去哪里'],['L3','进哪家'],['L4','怎么说'],['PACK','作战包']];
const heroOk=v=>v?.steps?.length&&v.map?.found?.length&&v.status==='completed';
async function heroSource(){
  // Showcase = a real run where the agent actually searched; never invented.
  if(!S.online){const c=S.convs.find(x=>heroOk(S.views[x.turns.at(-1)]));if(c){H.conv=c;H.view=S.views[c.turns.at(-1)];}return;}
  const cand=S.convs.filter(x=>x.status==='completed'&&x.turns).sort((a,b)=>(!!S.views[b.turns.at(-1)])-(!!S.views[a.turns.at(-1)])||(b.mode==='回放')-(a.mode==='回放'));
  for(const x of cand.slice(0,8)){
    try{await loadTurn(x.turns.at(-1));}catch{}
    const v=S.views[x.turns.at(-1)];if(heroOk(v)){H.conv=x;H.view=v;return;}
  }
}
function heroPicked(){
  const prof=productChoices().find(p=>p.id===$('h-p')?.value),ar=areaChoices().find(a=>a.id===$('h-a')?.value);
  return {profile:$('h-p')?.value,area:$('h-a')?.value,product:prof?.name||'洞庭山·新鲜活泉',areaName:ar?.name||AREA[$('h-a')?.value]||'狮山'};
}
function heroRender(){
  const v=H.view;
  $('h-flow').innerHTML=FLOW.map(([id,n],i)=>`${i?'<b>→</b>':''}<span data-f="${id}">${n}</span>`).join('');
  if(S.online&&S.profiles.length&&!$('h-p')){
    $('h-pick').innerHTML=`<label>产品<select id="h-p">${productChoices().map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label><label>商圈<select id="h-a">${areaChoices().map(a=>`<option value="${esc(a.id)}">${esc(a.name||AREA[a.id]||a.id)}</option>`).join('')}</select></label>`;
    $('h-p').value=S.profiles.some(p=>p.id==='xinxian-huoquan')?'xinxian-huoquan':S.profiles[0].id;
    if(areaChoices().some(a=>a.id==='shishan'))$('h-a').value='shishan';
  }else if(!S.online)$('h-pick').innerHTML=`<span class="fixed">产品 · ${esc(v?.product||'洞庭山·新鲜活泉')}</span><span class="fixed">商圈 · ${esc(AREA[v?.area_id]||'狮山')}</span>`;
  heroExamples();
  const n=S.convs.filter(c=>!c.draft).length;
  $('h-hist').textContent=n?`任务记录 · ${n}`:'进入工作台';
  $('h-play').hidden=!(H.conv&&v?.steps?.length);
  $('h-play-sub').textContent=v?`真实录制 · ${v.model||'模型'} · ${v.steps.filter(s=>s.kind==='tool').length} 次工具调用`:'';
  if(v&&H.statsFor!==v){H.statsFor=v;
    const found=v.map.found.length,terms=(v.terminals||[]).length;
    $('h-stats').innerHTML=[['',v.map.base.length,`${esc(AREA[v.area_id]||'')}缓存商户`],['or',found,'Agent 高德补采'],['cy',terms,'首访门店'],['',(v.pitches||[]).length,'渠道话术 · 合规通过']]
      .map(([c,num,l])=>`<div class="stat ${c}"><b data-to="${num}">0</b><span>${l}</span></div>`).join('')+`<span class="src">数字来自一次真实录制，不是示意</span>`;
    $('h-hud').hidden=!(v.steps||[]).length;
    $('h-hud-t').textContent=`AGENT · 找终端 · ${v.model||''}`;
    countUp();
  }else if(!v){$('h-stats').innerHTML='';$('h-hud').hidden=true;}
}
function heroExamples(){
  const p=S.online&&$('h-p')?heroPicked():{product:H.view?.product||'洞庭山·新鲜活泉',areaName:AREA[H.view?.area_id]||'狮山'};
  const ex=TEMPLATES({product:p.product,area:p.areaName});
  $('h-ask').placeholder=ex[0];
  $('h-ex').innerHTML=ex.map(t=>`<button type="button" data-hx="${esc(t)}">${esc(t)}</button>`).join('');
}
function countUp(){
  document.querySelectorAll('#h-stats b[data-to]').forEach((b,i)=>{const to=+b.dataset.to,t0=performance.now()+300+i*120,d=1100;
    const f=now=>{const k=Math.min(1,Math.max(0,(now-t0)/d));b.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1&&H.raf)requestAnimationFrame(f);else b.textContent=to;};
    reduced?b.textContent=to:requestAnimationFrame(f);});
}
function stepLine(s,v){
  if(s.kind==='model')return s.calls?.length?`<span class="k">思考</span> 决定调用 ${esc(s.calls.join('、'))}`:'<span class="k">思考</span> 整理结论';
  if(s.kind==='rejected')return '<span class="k">复核</span> 结论被代码打回，重写';
  if(s.tool==='search_merchants')return `<span class="k">高德</span> ${esc(s.args?.keywords||s.label||'')} → 新增 ${s.new??0} 家`;
  if(s.by_channel){const ch=Object.entries(s.by_channel).map(([id,n])=>`${esc(v.channel_names?.[id]||id)} ${n}`).join(' · ');return `<span class="k">盘点</span> ${ch}`;}
  return `<span class="k">工具</span> ${esc(s.label||s.tool)}`;
}
function heroLog(){
  const v=H.view;if(!v?.steps?.length)return;let i=0;const ol=$('h-log');ol.innerHTML='';
  const tick=()=>{const s=v.steps[i%v.steps.length];
    if(i&&i%v.steps.length===0)ol.innerHTML='';
    ol.insertAdjacentHTML('beforeend',`<li>${stepLine(s,v)}</li>`);while(ol.children.length>5)ol.firstElementChild.remove();
    i++;H.logTimer=setTimeout(tick,reduced?99999:1500);};
  tick();
  let k=0;const flow=()=>{document.querySelectorAll('#h-flow span').forEach((e,j)=>e.classList.toggle('on',j===k%FLOW.length));k++;H.flowTimer=setTimeout(flow,1300);};
  if(!reduced)flow();
}
function radarSetup(){
  const v=H.view,cv=$('radar');if(!cv)return;
  const R=v?.brief?.radius_m||v?.radius||3000;
  const base=(v?.map?.base||[]).map(([x,y])=>({x,y,a:Math.atan2(-y,x)}));
  const found=(v?.map?.found||[]).map((f,i)=>({x:f.x,y:f.y,a:Math.atan2(-f.y,f.x),i}));
  const terms=(v?.terminals||[]).filter(t=>t.grade!=='C').map(t=>({x:t.x,y:t.y,g:t.grade}));
  const zones=(v?.map?.zones||[]).map(z=>z.id.split(':').map(Number));
  H.pts={R,base,found,terms,zones,name:AREA[v?.area_id]||''};
}
function radarFrame(now){
  const cv=$('radar');if(!cv||$('hero').hidden){H.raf=0;return;}
  const dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,Hh=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(Hh*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hh);
  const P=H.pts;if(!P)return;
  const wide=W>900,cx=wide?W*0.68:W*0.5,cy=wide?Hh*0.47:Hh*0.24,rad=wide?Math.min(W*0.3,Hh*0.42):Math.min(W*0.46,Hh*0.22);
  const sc=rad/P.R,t=reduced?1e9:now-H.t0,sweep=reduced?0:(t*0.00075)%(Math.PI*2);
  const X=x=>cx+x*sc,Y=y=>cy-y*sc;
  // rings + cross
  g.lineWidth=1;
  for(let k=1;k<=Math.ceil(P.R/1000);k++){const r=Math.min(k*1000,P.R)*sc;g.strokeStyle=k*1000>=P.R?'rgba(79,209,230,.45)':'rgba(110,190,210,.14)';g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();
    g.fillStyle='rgba(140,180,190,.55)';g.font='11px '+getComputedStyle(document.body).getPropertyValue('--mono');g.fillText(`${Math.min(k,P.R/1000)}KM`,cx+r*0.72+4,cy-r*0.7);}
  g.strokeStyle='rgba(110,190,210,.10)';g.beginPath();g.moveTo(cx-rad,cy);g.lineTo(cx+rad,cy);g.moveTo(cx,cy-rad);g.lineTo(cx,cy+rad);g.stroke();
  // sweep wedge
  if(!reduced){for(let k=0;k<36;k++){const a0=-sweep-k*0.022;g.fillStyle=`rgba(79,209,230,${0.16*(1-k/36)})`;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,rad,a0-0.022,a0);g.closePath();g.fill();}
    g.strokeStyle='rgba(120,230,245,.8)';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(-sweep)*rad,cy+Math.sin(-sweep)*rad);g.stroke();}
  const lit=a=>{if(reduced)return .5;let d=(sweep-((a+Math.PI*2)%(Math.PI*2))+Math.PI*4)%(Math.PI*2);return Math.exp(-d*1.6);};
  // cached merchants
  for(const p of P.base){const b=lit(p.a);g.fillStyle=`rgba(${150+90*b|0},${200+40*b|0},${215+30*b|0},${0.3+0.65*b})`;g.fillRect(X(p.x)-1.1,Y(p.y)-1.1,2.2,2.2);}
  // zones appear after the agent finished
  const tFound=2200,per=Math.max(18,Math.min(60,5200/Math.max(1,P.found.length))),tDone=tFound+P.found.length*per;
  if(t>tDone){const k=Math.min(1,(t-tDone)/800);for(const [zx,zy] of P.zones){g.fillStyle=`rgba(79,209,230,${0.12*k})`;g.strokeStyle=`rgba(79,209,230,${0.7*k})`;g.fillRect(X(zx*500),Y((zy+1)*500),500*sc,500*sc);g.strokeRect(X(zx*500),Y((zy+1)*500),500*sc,500*sc);}}
  // agent-found merchants pop in
  for(const f of P.found){const at=tFound+f.i*per;if(t<at)continue;const age=t-at,b=lit(f.a);
    if(age<900&&!reduced){g.strokeStyle=`rgba(255,159,67,${1-age/900})`;g.beginPath();g.arc(X(f.x),Y(f.y),2+age/900*14,0,Math.PI*2);g.stroke();}
    g.fillStyle=`rgba(255,${150+60*b|0},${67+60*b|0},${0.75+0.25*b})`;g.beginPath();g.arc(X(f.x),Y(f.y),2.4+b*1.2,0,Math.PI*2);g.fill();}
  // first-visit terminals
  if(t>tDone+600){const k=Math.min(1,(t-tDone-600)/700),pulse=reduced?0:(Math.sin(t/420)+1)/2;
    for(const m of P.terms){g.strokeStyle=`rgba(79,209,230,${(0.55+0.4*pulse)*k})`;g.lineWidth=m.g==='A'?2:1.3;g.beginPath();g.arc(X(m.x),Y(m.y),(m.g==='A'?7:5)+pulse*2,0,Math.PI*2);g.stroke();}g.lineWidth=1;}
  // centre
  g.fillStyle='#e9f4f7';g.beginPath();g.arc(cx,cy,3.5,0,Math.PI*2);g.fill();
  g.fillStyle='rgba(233,244,247,.85)';g.font='600 12px '+getComputedStyle(document.body).getPropertyValue('--font');g.fillText(P.name,cx+8,cy-8);
  if(!reduced)H.raf=requestAnimationFrame(radarFrame);
}
function showHero(){
  H.dismissed=false;stopReplay(false);$('hero').hidden=false;$('hero').classList.remove('leaving');
  H.statsFor=null;heroRender();H.t0=performance.now();radarSetup();clearTimeout(H.logTimer);clearTimeout(H.flowTimer);heroLog();
  cancelAnimationFrame(H.raf);H.raf=requestAnimationFrame(radarFrame);
  try{history.replaceState(null,'',location.pathname+location.search);}catch{}
  if(document.activeElement!==$('h-ask'))setTimeout(()=>$('h-ask').focus({preventScroll:true}),400);
}
function leaveHero(then){
  const h=$('hero');H.dismissed=true;if(h.hidden){then?.();return;}
  clearTimeout(H.logTimer);clearTimeout(H.flowTimer);
  h.classList.add('leaving');then?.();
  const app=document.querySelector('.app');app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');
  setTimeout(()=>{h.hidden=true;cancelAnimationFrame(H.raf);H.raf=0;},reduced?0:600);
}
function heroWarn(html){$('h-warn').innerHTML=html;$('h-warn').hidden=!html;}
async function heroSubmit(){
  const text=$('h-ask').value.trim()||$('h-ask').placeholder;
  if(H.conn){heroWarn('<span>正在连接 Agent 服务…</span>');await H.conn;}
  if(!S.online||!S.config?.live_ready){
    heroWarn(`<span>${!S.online?'这是离线页面，没有连接 Agent 服务，不会执行这条任务。':`本地服务缺少实况配置（${esc((S.config?.missing||[]).join('、'))}），不会执行。`}</span>${H.conv?'<button type="button" data-hplay>看一次真实录制的执行过程</button>':''}`);
    return;
  }
  heroWarn('');const p=heroPicked();
  leaveHero(()=>newTask());
  // The composer's pickers are what send() reads; mirror the entry-screen choice into them.
  if($('p-sel')&&p.profile)$('p-sel').value=p.profile;if($('a-sel')&&p.area)$('a-sel').value=p.area;
  await send(text);
}
async function heroPlay(){if(!H.conv)return;const id=H.conv.turns.at(-1);if(S.online){try{await loadTurn(id);}catch{}}
  leaveHero(()=>{select(H.conv.id);setTimeout(startReplay,reduced?0:500);});}
function heroHistory(){leaveHero(()=>{const c=S.convs.find(c=>!c.draft);c?select(c.id):newTask();});}
$('h-form').addEventListener('submit',e=>{e.preventDefault();heroSubmit();});
$('hero').addEventListener('click',e=>{const t=e.target.closest('[data-hx],[data-hplay],#h-play,#h-hist');if(!t)return;
  if(t.dataset.hx!=null){$('h-ask').value=t.dataset.hx;$('h-ask').focus();return;}
  if(t.matches('[data-hplay],#h-play'))return heroPlay();
  if(t.id==='h-hist')return heroHistory();});
$('hero').addEventListener('change',e=>{if(e.target.matches('#h-p,#h-a'))heroExamples();});
document.querySelector('.brand').addEventListener('click',showHero);
document.querySelector('.brand').setAttribute('title','回到首页');

/* ================= boot ================= */
async function boot(){
  if(!location.hash){$('hero').hidden=false;H.view=(DATA?.tasks||[]).find(heroOk)||null;showHero();}
  let done;H.conn=new Promise(r=>done=r);
  if(location.protocol!=='file:'){
    try{
      const [config,profiles,areas]=await Promise.all([api('tasks/config'),api('profiles'),api('areas')]);
      Object.assign(S,{online:true,config,profiles,areas});document.body.classList.toggle("public-demo",!!config.public_demo);document.querySelector(".list-h").textContent=config.public_demo?"我的任务 · 仅当前浏览器":"任务记录";await refreshList();
    }catch{S.online=false;}
  }
  if(S.online){for(const [id,item] of Object.entries(CHAT)){try{const data=await api('chat/'+id);item.data={...data,conversation_id:id};if(!S.convs.some(c=>c.id===item.root)&&!data.latest_run)S.convs.push({id:item.root,draft:true,title:data.messages.find(m=>m.role==='user')?.content.slice(0,60)||'对话'});}catch{delete CHAT[id];}}saveChats();}
  if(!S.online)S.convs=offlineConvs();
  done();H.conn=null;
  const want=decodeURIComponent(location.hash.slice(1)).replace(/^task\//,'');
  const hit=want&&S.convs.find(c=>c.id===want||c.turns?.includes(want));
  if(hit){$('hero').hidden=true;select(hit.id);return;}
  // Leave the user's own pick alone if they already left the entry screen while we were loading.
  if(!(H.dismissed&&conv()&&!conv().draft)){if(S.convs.length)select(S.convs[0].id);else if(!conv())newTask();}
  if(H.dismissed)return;
  if($('hero').hidden)showHero();else heroRender();
  const had=H.view;await heroSource();
  if(H.dismissed||$('hero').hidden)return;
  if(had)H.view=had;
  if(!had&&H.view)showHero();else heroRender();
}
boot();
})();
