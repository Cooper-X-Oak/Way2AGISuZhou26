scenes:
- id: scene-1
  name: 应酬酒局
  visual_keywords: 商务宴请、举杯碰盏、酒瓶旁立着一瓶贡泉
  emotion: '"应酬多，常喝酒"——桌上常备，喝好酒更要配好水'
  source: .work/handbook/dongting-brief.md#B-使用场景/序号1
- id: scene-2
  name: 海鲜配啤酒
  visual_keywords: 夜宵大排档、蟹虾贝类、冰啤与贡泉同框
  emotion: '"吃海鲜，配啤酒"——尽兴有度，贡泉兜底'
  source: .work/handbook/dongting-brief.md#B-使用场景/序号2
- id: scene-3
  name: 家庭常备
  visual_keywords: 冰箱、餐桌、父母长辈的日常饮水
  emotion: 给家人的贴心常备，长寿之乡的水养一家人
  source: .work/handbook/dongting-brief.md#B-使用场景/序号3
- id: scene-4
  name: 火锅烧烤重口味
  visual_keywords: 辣锅、烤串、油腻后的顺口一瓶
  emotion: 重口味餐桌的"解腻顺口"搭档
  source: .work/handbook/dongting-brief.md#B-使用场景/序号4
- id: scene-5
  name: 节庆送礼
  visual_keywords: 黑金礼盒、春节/中秋伴手礼
  emotion: 把"长寿之乡"送进家门，有面子更有心意
  source: .work/handbook/dongting-brief.md#B-使用场景/序号5
