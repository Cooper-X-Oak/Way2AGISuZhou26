scenes:
- id: scene-1
  name: 直饮
  visual_keywords: 下班回家、运动归来、孩子放学，接一杯就喝，
  emotion: 新鲜的水不需要等待，入口即甘甜、健康饮水、喝大水
  source: .work/handbook/dongting-brief.md#A-使用场景/序号1
- id: scene-2
  name: 泡茶
  visual_keywords: 茶席、紫砂壶、明前碧螺春，好水配好茶
  emotion: 水新鲜，茶才鲜活；产区同源的双重讲究
  source: .work/handbook/dongting-brief.md#A-使用场景/序号2
- id: scene-3
  name: 煮饭
  visual_keywords: 厨房、电饭煲、当季新米，点按式取水器
  emotion: 新鲜水煮新鲜米，饭更香甜
  source: .work/handbook/dongting-brief.md#A-使用场景/序号3
- id: scene-4
  name: 煲汤
  visual_keywords: 砂锅慢炖、家常餐桌
  emotion: 好水吊出食材本味，汤更鲜
  source: .work/handbook/dongting-brief.md#A-使用场景/序号4
- id: scene-5
  name: 待客/日常养成
  visual_keywords: 饮水机常备、一家人的日常
  emotion: 好水养人每一天，品质生活的隐形标配
  source: .work/handbook/dongting-brief.md#A-使用场景/序号5
