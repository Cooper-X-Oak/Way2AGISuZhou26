<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>铺市 Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: task list | conversation | artifacts. One sans family, five sizes, colour only for meaning. */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --sunken:#eef2f3;
  --ink:#16242b; --ink-2:#44555d; --muted:#66767d; --line:#e1e7e9; --line-strong:#cdd6d9;
  --primary:#0b6a88; --primary-ink:#ffffff; --primary-soft:#e3f1f6;
  --found:#b5600a; --found-soft:#fbeedd;
  --danger:#b3372f; --danger-soft:#fbe7e5;
  --ok:#2b7a4b; --ok-soft:#e3f2e9;
  --idle:#8a979c; --dot:#c3cdd1;
  --font:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,ui-monospace,monospace;
  --t-xs:12px; --t-sm:13px; --t-md:14px; --t-lg:16px; --t-xl:20px;
  --r-sm:6px; --r-lg:12px; --h-sm:28px; --h-md:36px;
  --shadow:0 1px 2px rgba(16,36,43,.06),0 8px 24px rgba(16,36,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#152127; --sunken:#1b2a31;
  --ink:#e6edf0; --ink-2:#b8c6cc; --muted:#93a3aa; --line:#24343b; --line-strong:#35484f;
  --primary:#2b8fb0; --primary-ink:#ffffff; --primary-soft:#173847;
  --found:#f0a24a; --found-soft:#3a2b18;
  --danger:#ec7b72; --danger-soft:#3b2120;
  --ok:#6cc391; --ok-soft:#183427;
  --idle:#7f9097; --dot:#3d525a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#152127; --sunken:#1b2a31;
  --ink:#e6edf0; --ink-2:#b8c6cc; --muted:#93a3aa; --line:#24343b; --line-strong:#35484f;
  --primary:#2b8fb0; --primary-ink:#ffffff; --primary-soft:#173847;
  --found:#f0a24a; --found-soft:#3a2b18;
  --danger:#ec7b72; --danger-soft:#3b2120;
  --ok:#6cc391; --ok-soft:#183427;
  --idle:#7f9097; --dot:#3d525a; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100dvh;overflow:hidden}
html{height:100dvh}
body{background:var(--bg);color:var(--ink);font:var(--t-md)/1.6 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3,p{margin:0}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.small{font-size:var(--t-xs);color:var(--muted)}
.muted{color:var(--muted)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

.app{max-width:1600px;height:calc(100dvh - 32px);margin:0 auto;display:grid;grid-template-columns:clamp(220px,17vw,264px) minmax(0,1fr);gap:24px}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.brand{display:grid;gap:2px;padding:4px 10px 0}
.brand b{font-size:var(--t-lg);font-weight:600;letter-spacing:.01em}
.newbtn{height:var(--h-md);border:1px solid var(--primary);color:var(--primary);border-radius:var(--r-sm);font-weight:600;font-size:var(--t-sm);display:flex;align-items:center;gap:6px;padding:0 12px}
.newbtn:hover{background:var(--primary-soft)}
.list-h{padding:6px 10px 0}
.tasks{list-style:none;margin:0;padding:0;overflow:auto;overscroll-behavior:contain;display:grid;gap:2px;align-content:start;min-height:0}
.task{width:100%;text-align:left;border-radius:var(--r-sm);padding:9px 10px 9px 13px;display:grid;gap:3px;position:relative}
.task:hover{background:var(--sunken)}
.task[aria-current="true"]{background:var(--sunken)}
.task[aria-current="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--primary)}
.task .t{font-size:var(--t-md);font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .m{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--muted);min-width:0}
.task .m span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:500;white-space:nowrap;flex:none}
.chip.draft{border:1px solid var(--line-strong);color:var(--muted)}
.chip.queued{background:var(--sunken);color:var(--idle)}
.chip.running{background:var(--primary-soft);color:var(--primary)}
.chip.ask{background:var(--found-soft);color:var(--found)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.stop{background:var(--danger-soft);color:var(--danger)}
.chip.fail{background:var(--danger);color:#fff}
.pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px;min-height:0;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
.head h1{font-size:var(--t-xl);font-weight:600;line-height:1.35;min-width:0}
.head h1 .sep{color:var(--idle);font-weight:400;margin:0 6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:var(--t-sm);color:var(--muted)}

/* progress rail */
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(9,minmax(72px,1fr));overflow-x:auto}
.node{position:relative;display:grid;justify-items:center;gap:4px;padding:4px 4px 6px;text-align:center;cursor:pointer;border-radius:var(--r-sm)}
.node:hover{background:var(--sunken)}
.node::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}
.node:first-child::before{display:none}
.node.passed::before{background:var(--ok)}
.dotn{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;margin-top:5px}
.node.done .dotn{background:var(--ok);border-color:var(--ok)}
.node.done .dotn::after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.node.run .dotn{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);animation:ring 1.8s ease-in-out infinite}
.node.agent.run .dotn{background:var(--found);border-color:var(--found);box-shadow:0 0 0 4px var(--found-soft)}
.node.ask .dotn{background:var(--found);border-color:var(--found)}
.node.ask .dotn::after,.node.stop .dotn::after{content:"!"}
.node.stop .dotn{background:var(--danger);border-color:var(--danger)}
@keyframes ring{50%{box-shadow:0 0 0 7px transparent}}
.node .nm{font-size:var(--t-sm);color:var(--idle);white-space:nowrap}
.node.done .nm,.node.run .nm,.node.ask .nm,.node.stop .nm{color:var(--ink)}
.node.run .nm{font-weight:600}
.node .ag{font-size:10px;color:var(--found);font-weight:600;margin-left:3px;letter-spacing:.04em}
.node .sm{font-size:var(--t-xs);color:var(--muted);line-height:1.35;max-width:120px}
.node.sel .nm{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.card-h h2{font-size:var(--t-lg);font-weight:600}
.linkbtn{color:var(--primary);font-size:var(--t-sm)}
.linkbtn:hover{text-decoration:underline}

/* ---------- conversation ---------- */
.livebar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--primary-soft);color:var(--primary);font-size:var(--t-sm);border-bottom:1px solid var(--line)}
.livebar b{font-weight:600}
.thread{flex:1;overflow:auto;overscroll-behavior:contain;padding:18px 16px 8px;display:grid;gap:18px;align-content:start;min-height:0}
.msg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.av.u{background:var(--ink);color:var(--surface)}
.av.a{background:var(--primary);color:#fff}
.av.s{background:var(--sunken);color:var(--muted)}
.av svg{width:14px;height:14px}
.mb{display:grid;gap:6px;min-width:0}
.who{display:flex;align-items:baseline;gap:8px;font-size:var(--t-xs);color:var(--muted)}
.who b{font-size:var(--t-sm);font-weight:600;color:var(--ink)}
.bubble{background:var(--sunken);border-radius:var(--r-sm) var(--r-lg) var(--r-lg) var(--r-lg);padding:9px 12px;justify-self:start;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.prose{display:grid;gap:6px}
.prose ul{margin:0;padding-left:18px}
.callout{border-left:3px solid var(--found);padding:4px 0 4px 12px;display:grid;gap:8px}
.callout.stop{border-color:var(--danger)}
.answers{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:var(--h-sm);padding:0 12px;border-radius:999px;background:var(--sunken);font-size:var(--t-sm);white-space:nowrap}
.pill:hover{background:var(--primary-soft);color:var(--primary)}
.pill.primary{background:var(--primary);color:var(--primary-ink)}
.links{display:flex;flex-wrap:wrap;gap:4px 14px}

/* execution timeline */
details.run{border-radius:var(--r-sm)}
details.run>summary{list-style:none;cursor:pointer;font-size:var(--t-sm);color:var(--muted);display:flex;align-items:center;gap:6px}
details.run>summary::-webkit-details-marker{display:none}
details.run>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.run[open]>summary::before{transform:rotate(45deg)}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px}
.tl li{position:relative;display:grid;gap:3px;animation:fade .25s ease both}
.tl li::before{content:"";position:absolute;left:-19px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--idle)}
.tl li.m::before{background:var(--primary)}
.tl li.t::before{background:var(--found)}
.tl li.r::before{background:var(--danger)}
.tl .h{font-size:var(--t-sm);font-weight:600}
.tl .note{font-size:var(--t-sm);color:var(--ink-2);font-style:italic;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.tl .note.open{-webkit-line-clamp:unset}
.args{display:flex;flex-wrap:wrap;gap:4px}
.arg{font-size:var(--t-xs);background:var(--sunken);border-radius:4px;padding:1px 6px;overflow-wrap:anywhere}
.arg i{font-style:normal;color:var(--muted);margin-right:4px}
.res{font-size:var(--t-sm);color:var(--ink-2)}
.res .num{color:var(--found)}
.res.err{color:var(--danger)}
.typing{display:flex;gap:4px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--idle);animation:pulse 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

/* composer */
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px;position:relative}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.quick::-webkit-scrollbar{display:none}
.quick .lab{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;margin-right:2px}
.pickers{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--t-sm)}
.pickers select{height:var(--h-sm);border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 8px}
.box{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--surface);padding:6px 6px 6px 12px}
.box:focus-within{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.box textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;line-height:1.5;padding:4px 0;max-height:120px;font-size:var(--t-md)}
.ibtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted);flex:none}
.ibtn:hover{background:var(--sunken);color:var(--ink)}
.ibtn[aria-expanded="true"]{color:var(--primary);background:var(--primary-soft)}
.ibtn svg{width:18px;height:18px}
.send{background:var(--primary);color:var(--primary-ink)}
.send:hover{background:var(--primary);color:var(--primary-ink);filter:brightness(1.08)}
.send:disabled{background:var(--sunken);color:var(--idle);cursor:not-allowed;filter:none}
.hint{font-size:var(--t-xs);color:var(--muted)}
.toolbox{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(10,30,40,.18);max-height:360px;overflow:auto;padding:8px;z-index:5}
.tb-g{padding:6px 6px 8px}
.tb-g h3{font-size:var(--t-xs);color:var(--muted);font-weight:500;margin-bottom:4px}
.tb-i{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:var(--r-sm);font-size:var(--t-sm)}
.tb-i:hover,.tb-i.on{background:var(--sunken)}

/* ---------- artifacts ---------- */
.seg{display:flex;background:var(--sunken);border-radius:var(--r-sm);padding:2px}
.seg button{height:28px;padding:0 12px;border-radius:5px;font-size:var(--t-sm);color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-height:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:var(--t-sm);color:var(--ink-2);align-items:baseline}
.counts .num{font-size:var(--t-lg);color:var(--ink);margin-left:4px}
.counts .found .num{color:var(--found)}
.legend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 14px;font-size:var(--t-xs);color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mapwrap{position:relative;width:100%;max-width:min(100%,60vh,560px);margin:0 auto;aspect-ratio:1}
.mapwrap svg{width:100%;height:100%;display:block}
.mapnote{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mapnote span{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:var(--t-sm);color:var(--muted)}
.m-ring{fill:none;stroke:var(--line-strong);stroke-width:20}
.m-ring.tbd{stroke-dasharray:80 60}
.m-grid{stroke:var(--line);stroke-width:8}
.m-base{fill:var(--dot)}
.m-found{fill:var(--found)}
.m-zone{fill:var(--primary-soft);stroke:var(--primary);stroke-width:20}
.m-term{fill:none;stroke:var(--primary);stroke-width:18}
.m-term.A{stroke:var(--ink);stroke-width:24}
.m-ctr{fill:var(--ink)}
.m-lab{fill:var(--muted);font:150px var(--font)}

.dec{list-style:none;margin:0;padding:0}
.dec li{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.dec li:first-child{border-top:0;padding-top:0}
.dec li.hl{background:linear-gradient(90deg,var(--primary-soft),transparent 70%);margin:0 -16px;padding-left:16px;padding-right:16px}
.dec .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.dec .id{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);width:34px}
.dec .nm{font-weight:600}
.src{font-size:var(--t-xs);color:var(--muted)}
.src.llm{color:var(--found);font-weight:500}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--t-xs);color:var(--muted)}
.checks span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--ok)}
.checks .needs_review::before{background:var(--found)}
.checks .failed::before,.checks .blocked::before{background:var(--danger)}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:var(--t-xs);font-weight:500;color:var(--muted);white-space:nowrap}
.grade{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 12px var(--mono)}
.grade.A{background:var(--ink);color:var(--surface)}
.grade.B{background:var(--line-strong);color:var(--ink)}
.grade.C{border:1px solid var(--line-strong);color:var(--muted)}
tr.C td{color:var(--muted)}
.tagf{font-size:var(--t-xs);color:var(--found);margin-left:6px;white-space:nowrap}
.nowrap{white-space:nowrap}
.pitch{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.pitch:first-child{border-top:0;padding-top:0}
.pitch h3{font-size:var(--t-sm);font-weight:600;display:flex;gap:8px;align-items:baseline}
.pitch p{line-height:1.75;max-width:62ch;color:var(--ink-2)}
.ok{color:var(--ok);font-size:var(--t-xs);font-weight:500}
.empty{display:grid;justify-items:center;gap:8px;padding:48px 16px;color:var(--muted);font-size:var(--t-sm);text-align:center}
.empty svg{width:24px;height:24px;color:var(--idle)}
.boundary{font-size:var(--t-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:grid;gap:2px}

/* new task */
.welcome{display:grid;gap:14px;padding:24px 4px}
.welcome h3{font-size:var(--t-lg);font-weight:600}
.examples{display:grid;gap:6px}
.example{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:var(--t-sm);color:var(--ink-2)}
.example:hover{border-color:var(--primary);color:var(--ink)}

.mobtabs{display:none}
.app{grid-template-rows:minmax(0,1fr);overflow:hidden}
.card-h,.composer,.livebar{flex:none}
@media (max-width:1180px){
  .main{grid-template-rows:auto auto auto minmax(0,1fr)}
  .mobtabs{display:flex;gap:8px}.mobtabs button{padding:4px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
  .mobtabs button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary)}
  .panes{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .panes .card.art{display:none}
  .panes[data-show="art"]>.card:first-child{display:none}
  .panes[data-show="art"]>.card.art{display:flex}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:72px minmax(0,1fr);gap:12px}
  .side{display:grid;grid-template-columns:auto 1fr;align-items:center}
  .side .brand,.side .list-h{display:none}
  .tasks{grid-auto-flow:column;grid-auto-columns:minmax(200px,70vw);overflow-x:auto}
  .rail{grid-template-columns:repeat(9,84px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="任务">
    <div class="brand"><b>铺市 Agent</b><span class="small">新品进店 · 市场开发策略</span></div>
    <button class="newbtn" id="newbtn" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>新建任务</button>
    <span class="small list-h">任务记录</span>
    <ul class="tasks" id="tasks"></ul>
  </aside>

  <main class="main">
    <div class="head"><h1 id="title"></h1><div class="meta" id="meta"></div></div>
    <ol class="rail" id="rail" aria-label="关卡进度"></ol>
    <div class="mobtabs" aria-label="切换工作区"><button type="button" data-pane="chat" aria-pressed="true">对话</button><button type="button" data-pane="art" aria-pressed="false">产物</button></div>
    <div class="panes">
      <section class="card" aria-labelledby="chat-h">
        <div class="card-h"><h2 id="chat-h">对话</h2><button class="linkbtn" id="replay" type="button" hidden>回看执行过程</button></div>
        <div class="livebar" id="livebar" hidden></div>
        <div class="thread" id="thread" aria-live="polite"></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="toolbox" id="toolbox" hidden role="listbox" aria-label="百宝箱"></div>
          <div class="pickers" id="pickers" hidden></div>
          <div class="quick" id="quick"></div>
          <div class="box">
            <textarea id="ask" rows="1" aria-label="给 Agent 的指令"></textarea>
            <button class="ibtn" id="tb" type="button" aria-expanded="false" aria-controls="toolbox" title="百宝箱（输入 / 也能打开）"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="5" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 5V3.8c0-.7.5-1.3 1.2-1.3h2.6c.7 0 1.2.6 1.2 1.3V5M2.5 9.5h13" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
            <button class="ibtn send" id="send" type="submit" title="发送"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 9h11M9.5 4.5 14 9l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <span class="hint" id="hint"></span>
        </form>
      </section>
      <section class="card art" aria-labelledby="art-h">
        <div class="card-h"><h2 id="art-h">产物</h2>
          <div class="seg" role="tablist" id="seg">
            <button type="button" role="tab" data-tab="map">地图</button>
            <button type="button" role="tab" data-tab="dec">决策</button>
            <button type="button" role="tab" data-tab="list">名单</button>
            <button type="button" role="tab" data-tab="pitch">话术</button>
          </div>
        </div>
        <div class="panel" id="panel"></div>
      </section>
    </div>
  </main>
</div>

<script>
const DATA=/*__DATA__*/null;
/* pure:start — no DOM access; covered by tests/workbench-conversation.test.cjs */
function groupTaskRecords(rows){
  const by=new Map(rows.map(r=>[r.run_id,r])),out=new Map();
  for(const r of rows){let root=r;const seen=new Set([r.run_id]);
    while(root.task?.parent_id&&by.has(root.task.parent_id)&&!seen.has(root.task.parent_id)){root=by.get(root.task.parent_id);seen.add(root.run_id);}
    if(!out.has(root.run_id))out.set(root.run_id,{root,rows:[]});out.get(root.run_id).rows.push(r);}
  return [...out.values()].map(({root,rows})=>{rows.sort((a,b)=>a.task.created_at.localeCompare(b.task.created_at));return {root,latest:rows.at(-1),ids:rows.map(r=>r.run_id)};})
    .sort((a,b)=>b.latest.task.created_at.localeCompare(a.latest.task.created_at));
}
function taskRequestBody({conv,view,text,profile,area}){
  if(!conv||conv.draft)return {area,profile,input:text,mode:'live'};
  return {area:conv.area_id||view?.area_id,profile:conv.profile||view?.task?.profile,input:text,mode:'live',parent_id:conv.turns.at(-1)};
}
/* pure:end */
(()=>{
/* ================= constants ================= */
const STAGES=[['L0','立项'],['L1','卖给谁'],['L1D','找终端'],['L2','去哪里'],['L2C','对手'],['L3','进哪家'],['L3P','供货'],['L4','怎么说'],['PACK','作战包']];
const SNAME=Object.fromEntries(STAGES);
const AREA={shishan:'狮山',guanqian:'观前街',ligongdi:'李公堤'};
const CAT={restaurant:'餐馆',tea:'茶馆',office:'写字楼',gym:'健身',other:'其他'};
const ARG={keywords:'关键词',types:'类型码',max_pages:'页数',channel_id:'渠道',category:'类别',type_prefix:'类型前缀',page:'页'};
const FOLLOW={
  L0:['把半径改成 2 公里，3 个地推，做 6 周','这个产品还缺哪些资料？'],
  L1:['解释为什么这几个渠道是 P1','加一个渠道：社区便利店'],
  L1D:['写字楼候选再补采一些，最多 2 页','茶馆只找到少量候选，换些关键词再找找','列出补采到但没进首访名单的健身房'],
  L2:['为什么只选了这几个网格？','放宽到前 2 个网格，A/B 门店还够吗'],
  L2C:['选中网格里有哪些竞品点位？'],
  L3:['列出 A 级首访门店和理由','把 C 级里 300 米以内的门店列出来'],
  L3P:['推荐 3 公里内的供货方'],
  L4:['为写字楼重写话术：对象是物业和企业行政','为健身房写一段 30 秒开场白'],
  PACK:['导出第一周首访路线','汇总成一页给区域经理的简报']};
const TEMPLATES=p=>[`${p.area}商圈周边 3 公里推广${p.product}，先分析客户和拓客策略`,`${p.area}周边 2 公里推广${p.product}，3 个地推，做 6 周，先找写字楼和健身房`];
const DONE=s=>['completed','blocked','failed'].includes(s);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtTime=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?'':d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});};
const ICON={info:'<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 6.2v3.6M7 4.2v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  empty:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.5"/></svg>'};

/* ================= state ================= */
const S={online:false,config:null,profiles:[],areas:[],convs:[],cur:null,views:{},tab:'map',stage:null,toolbox:false,tbIndex:-1,sending:false,error:'',replay:null,timer:null,notices:{}};

/* ================= data: offline ================= */
function offlineConvs(){
  return (DATA?.tasks||[]).map((t,i)=>{const id='offline-'+i;S.views[id]=t;
    return {id,turns:[id],title:t.request||t.title,product:t.product,area:AREA[t.area_id]||t.area||'',status:t.status,stopped_at:t.stopped_at,created_at:t.created_at,mode:t.mode,offline:true};});
}

/* ================= data: online ================= */
async function api(path,body){
  const r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  let data=null;try{data=await r.json();}catch{}
  if(!r.ok){const e=new Error(typeof data?.detail==='string'?data.detail:'服务没有响应');e.status=r.status;throw e;}
  return data;
}
function group(rows){
  return groupTaskRecords(rows).map(({root,latest:last,ids})=>({id:root.run_id,turns:ids,title:root.task.message,product:root.task.product,area:AREA[root.task.area]||root.task.area,
      area_id:root.task.area,profile:root.task.profile,status:last.status,stopped_at:last.stopped_at,current_stage:last.current_stage,created_at:root.task.created_at,updated_at:last.task.created_at,mode:root.task.mode==='replay'?'回放':'实况'}));
}
async function refreshList(){const rows=await api('tasks');const keep=S.convs.filter(c=>c.draft);S.convs=[...keep,...group(rows)];}
async function loadTurn(id,force){
  const v=S.views[id];if(v&&DONE(v.status)&&!force)return;
  try{S.views[id]=await api(`tasks/${id}/view`);}catch(e){if(e.status!==409)throw e;S.views[id]={pending:true,status:'queued'};}
}
async function poll(){
  clearTimeout(S.timer);const c=conv();if(!S.online||!c||c.draft)return;
  try{
    await Promise.all(c.turns.map(id=>loadTurn(id)));
    const last=S.views[c.turns.at(-1)];
    if(last&&!last.pending){c.status=last.status;c.current_stage=last.current_stage;c.stopped_at=last.stopped_at;}
    S.error='';
  }catch(e){S.error=e.message;}
  render();
  if(!DONE(conv()?.status))S.timer=setTimeout(poll,1000);
}

/* ================= helpers ================= */
const conv=()=>S.convs.find(c=>c.id===S.cur);
const lastView=()=>{const c=conv();return c&&!c.draft?S.views[c.turns.at(-1)]:null;};
function statusChip(st,stage,questions){
  if(st==='draft')return '<span class="chip draft">草稿</span>';
  if(st==='queued')return '<span class="chip queued">排队中</span>';
  if(st==='running'||st==='gate_pending')return `<span class="chip running"><span class="pulse"></span>执行中${stage?' · '+esc(SNAME[stage]||stage):''}</span>`;
  if(st==='completed')return '<span class="chip done">已完成</span>';
  if(st==='blocked'&&(questions?.length||stage==='L0'))return '<span class="chip ask">等你补充</span>';
  if(st==='blocked')return `<span class="chip stop">停在${esc(SNAME[stage]||stage||'')}</span>`;
  if(st==='failed')return '<span class="chip fail">出错</span>';
  return '';
}
function briefText(b){if(!b)return '';const parts=[];
  if(b.radius_m)parts.push(`${+(b.radius_m/1000).toFixed(1)} 公里`);
  if(b.delivery_people)parts.push(`${b.delivery_people} 人`);
  if(b.weeks)parts.push(`${b.weeks} 周`);
  const miss=['radius_m'].filter(k=>!b[k]).map(()=> '半径');
  if(!b.delivery_people||!b.weeks)parts.push('人员排期待安排');
  return parts.join(' · ')+(miss.length?(parts.length?' · ':'')+'待补充'+miss.join('、'):'');}
function stageSummary(v,s){
  if(s.id==='L0')return briefText(v.brief);
  if(!s.done)return '';
  const t=(s.summary||'').replace(/None/g,'—');
  return /^—?$|^0 /.test(t)?'':t;
}

/* ================= render: sidebar ================= */
function renderList(){
  $('tasks').innerHTML=S.convs.map(c=>`<li><button class="task" type="button" data-id="${esc(c.id)}" aria-current="${c.id===S.cur}">
    <span class="t">${esc(c.draft?'新任务':c.title)}</span>
    <span class="m">${statusChip(c.draft?'draft':c.status,c.status==='running'?c.current_stage:c.stopped_at,null)}<span>${esc([c.area,c.draft?'':fmtTime(c.updated_at||c.created_at)].filter(Boolean).join(' · '))}</span></span></button></li>`).join('')
    ||'<li class="small" style="padding:8px 10px">还没有任务</li>';
}

/* ================= render: head + rail ================= */
function renderHead(){
  const c=conv(),v=lastView();
  if(!c||c.draft){$('title').textContent='新任务';$('meta').innerHTML='<span>选择产品和商圈，描述推广目标</span>';return;}
  const prod=v?.product||c.product||'',area=AREA[v?.area_id]||c.area||'';
  $('title').innerHTML=`${esc(prod)}<span class="sep">×</span>${esc(area)}`;
  const st=v&&!v.pending?v.status:c.status, stage=st==='running'?(v?.current_stage||c.current_stage):(v?.stopped_at||c.stopped_at);
  const bits=[statusChip(st,stage,v?.questions),`<span>${esc(fmtTime(v?.created_at||c.created_at))}</span>`];
  if(v?.mode==='回放'||c.mode==='回放')bits.push('<span>回放真实录制</span>');
  if(v?.model)bits.push(`<span>模型 ${esc(v.model)}</span>`);
  $('meta').innerHTML=bits.join('');
}
function renderRail(){
  const v=lastView(),st=v&&!v.pending?v.status:conv()?.status;
  const stages=v?.stages||STAGES.map(([id,name])=>({id,name}));
  $('rail').innerHTML=stages.map((s,i)=>{
    let cls='';
    if(s.done)cls='done';
    else if(st==='running'&&v?.current_stage===s.id)cls='run';
    else if(s.stopped||(st==='blocked'&&v?.stopped_at===s.id))cls=(s.id==='L0'&&v?.questions?.length)?'ask':'stop';
    const prevDone=i>0&&stages[i-1].done;
    const sm=v&&!v.pending?stageSummary(v,s):'';
    return `<li class="node ${cls}${prevDone&&(s.done||cls)?' passed':''}${s.id==='L1D'?' agent':''}${S.stage===s.id?' sel':''}" data-stage="${s.id}" tabindex="0" role="button" aria-label="${esc(SNAME[s.id])}">
      <span class="dotn"></span><span class="nm">${esc(SNAME[s.id])}${s.id==='L1D'?'<span class="ag">AGENT</span>':''}</span>${sm?`<span class="sm">${esc(sm)}</span>`:''}</li>`;}).join('');
}

/* ================= render: conversation ================= */
function msg(kind,who,meta,inner){
  const av={u:'<span class="av u">你</span>',a:'<span class="av a">A</span>',s:`<span class="av s">${ICON.info}</span>`}[kind];
  return `<div class="msg">${av}<div class="mb"><div class="who"><b>${who}</b>${meta?`<span>${meta}</span>`:''}</div>${inner}</div></div>`;
}
function stepHTML(s,v){
  if(s.kind==='model')return `<li class="m"><span class="h">${s.calls?.length?'决定调用：'+esc(s.calls.join('、')):'整理结论'}</span>${s.note?`<span class="note" title="点击展开">${esc(s.note)}</span>`:''}</li>`;
  if(s.kind==='rejected')return `<li class="r"><span class="h">结论没通过代码复核，打回重写</span><span class="res err">${esc((s.problems||[]).join('；'))}</span></li>`;
  const a=Object.entries(s.args||{}).map(([k,val])=>`<span class="arg"><i>${esc(ARG[k]||k)}</i>${esc(val)}</span>`).join('');
  let r='';
  if(!s.ok)r=`<span class="res err">${esc(s.error||'调用失败')}</span>`;
  else if(s.tool==='search_merchants')r=`<span class="res">返回 <span class="num">${s.returned??0}</span> 条，新增 <span class="num">${s.new??0}</span> 家</span>`;
  else if(s.by_channel){const ch=(v.channels?.length?v.channels:Object.keys(s.by_channel).map(id=>({id,name:v.channel_names?.[id]||id})));
    r=`<span class="res">${s.by_category?Object.entries(s.by_category).map(([k,n])=>`${esc(CAT[k]||k)} ${n}`).join('、')+'；':''}目标渠道 ${ch.map(c=>`${esc(c.name)} <span class="num">${s.by_channel[c.id]??0}</span>`).join('、')}</span>`;}
  else if(s.total!=null)r=`<span class="res">共 <span class="num">${s.total}</span> 条</span>`;
  return `<li class="t"><span class="h">${esc(s.label||s.tool)}</span>${a?`<div class="args">${a}</div>`:''}${r}</li>`;
}
function turnHTML(id,idx,isLast){
  const c=conv(),v=S.views[id]||{pending:true},out=[];
  const message=v.task?.message||(idx===0?c.title:'')||v.request;
  out.push(msg('u','你',idx?'补充要求':'',`<div class="bubble">${esc(message)}</div>`));
  if(v.pending||v.status==='queued'){if(isLast)out.push(msg('a','Agent','准备中','<div class="typing"><i></i><i></i><i></i></div>'));return out.join('');}
  const running=v.status==='running'||v.status==='gate_pending';
  let steps=v.steps||[];
  if(S.replay&&S.replay.id===id)steps=steps.slice(0,S.replay.k);
  if(steps.length||(running&&v.current_stage==='L1D')){
    const cat=v.cache?.by_category||{};
    const intro=steps.length?`<p>缓存里有 <span class="num">${v.cache?.total??0}</span> 家（${Object.entries(cat).map(([k,n])=>`${esc(CAT[k]||k)} ${n}`).join('、')||'—'}），先看看目标渠道够不够。</p>`:'';
    const live=running&&v.current_stage==='L1D';
    out.push(msg('a','Agent',esc(v.model?'找终端 · '+v.model:'找终端'),`<div class="prose">${intro}<details class="run" ${live||!DONE(v.status)||S.replay?.id===id||!v.decision?'open':''}><summary>${steps.length?`执行过程 · ${steps.length} 步`:'开始执行…'}</summary><ol class="tl">${steps.map(s=>stepHTML(s,v)).join('')}${live||(S.replay?.id===id&&S.replay.k<v.steps.length)?'<li><div class="typing"><i></i><i></i><i></i></div></li>':''}</ol></details></div>`));
  }
  const replaying=S.replay?.id===id&&S.replay.k<(v.steps||[]).length;
  const agentRan=(v.steps||[]).length>0||v.stages?.find(s=>s.id==='L1D')?.judged_by==='模型';
  if(agentRan&&v.decision&&!replaying&&(DONE(v.status)||v.stages?.find(s=>s.id==='L1D')?.done)){
    out.push(msg('a','Agent','结论',`<div class="prose"><p>${esc(v.decision)}</p>${v.channels?.length?`<p class="small">补采后：${v.channels.map(c=>`${esc(c.name)} ${c.after} 家`).join('，')}</p>`:''}</div>`));
  }
  if(running&&!(v.current_stage==='L1D'))out.push(msg('s','流水线',esc('正在'+(SNAME[v.current_stage]||'')),'<div class="typing"><i></i><i></i><i></i></div>'));
  if(replaying||running)return out.join('');
  if(v.status==='blocked'&&v.questions?.length){
    out.push(msg('s','流水线','开始前需要确认',`<div class="callout"><p>还差 ${v.questions.length} 项信息，补充后会在这个对话里继续：</p><ul>${v.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>${isLast?`<div class="answers">${answerChips(v).map(a=>`<button class="pill" type="button" data-fill="${esc(a)}">${esc(a)}</button>`).join('')}</div>`:''}</div>`));
  }else if(v.status==='blocked'){
    const why=v.stop_reason||'这一关没有通过检查';
    const hint=v.stopped_at==='L2'&&!(v.steps||[]).length?'缓存里没有目标渠道的门店。开启 Agent「找终端」可以去高德补采。':'';
    out.push(msg('s','流水线',`停在${esc(SNAME[v.stopped_at]||v.stopped_at||'')}`,`<div class="callout stop"><p>${esc(why)}</p>${hint?`<p class="small">${esc(hint)}</p>`:''}</div>`));
  }else if(v.status==='failed'){
    out.push(msg('s','流水线','出错',`<div class="callout stop"><p>${esc(v.stop_reason||'执行中断，可以重新发送这条要求。')}</p></div>`));
  }else if(v.status==='completed'){
    const g={A:0,B:0,C:0};(v.terminals||[]).forEach(t=>g[t.grade]++);const first=(v.route?.first||[]).filter(Boolean);
    out.push(msg('s','流水线汇总','由代码根据各关产物生成',`<div class="prose"><p>选中 <span class="num">${v.map?.zones?.length||0}</span> 个网格；首访名单 <span class="num">${(v.terminals||[]).length}</span> 家（A ${g.A} · B ${g.B} · C ${g.C}）${(v.terminals||[]).some(t=>t.found)?`，其中 <span class="num">${v.terminals.filter(t=>t.found).length}</span> 家由 Agent 补采`:''}。</p>${v.route?.pending?'<p>策略与客户清单已生成，人员排期待安排。需要具体日程时，再补充人数和周期。</p>':''}${first.length?`<p>第 1 天首访：${esc(first.slice(0,4).join('、'))}${first.length>4?` 等 ${first.length} 家`:''}。</p>`:''}${v.pitches?.length?`<p>已为 ${v.pitches.length} 个渠道准备进店话术，均过合规扫描。</p>`:''}<div class="links"><button class="linkbtn" data-tab="map" type="button">看地图</button><button class="linkbtn" data-tab="list" type="button">看名单</button><button class="linkbtn" data-tab="pitch" type="button">看话术</button><button class="linkbtn" data-tab="dec" type="button">看决策</button></div></div>`));
  }
  return out.join('');
}
function answerChips(v){
  const b=v.brief||{},qs=(v.questions||[]).join(' '),miss={radius_m:!b.radius_m,delivery_people:!b.delivery_people&&/人数|几位|几人|delivery_people/.test(qs),weeks:!b.weeks&&/几周|周期|weeks/.test(qs)};
  const parts=[miss.radius_m&&'3 公里',miss.delivery_people&&'2 个地推',miss.weeks&&'做 4 周'].filter(Boolean);
  const alt=[miss.radius_m&&'2 公里',miss.delivery_people&&'3 个地推',miss.weeks&&'做 6 周'].filter(Boolean);
  return [parts.join('，'),alt.join('，')].filter(Boolean);
}
function renderThread(){
  const c=conv(),th=$('thread'),atEnd=th.scrollHeight-th.scrollTop-th.clientHeight<60,pos=th.scrollTop;
  const v=lastView(),running=v&&(v.status==='running'||v.status==='gate_pending');
  $('livebar').hidden=!running;
  if(running){const tools=(v.steps||[]).filter(s=>s.kind==='tool').length;$('livebar').innerHTML=`<span class="pulse"></span><b>正在：${esc(SNAME[v.current_stage]||'准备')}</b>${tools?`<span>· 已调用工具 ${tools} 次</span>`:''}`;}
  $('replay').hidden=!c||c.draft||!v||!DONE(v.status)||!(v.steps||[]).length;
  $('replay').textContent=S.replay?'停止回看':'回看执行过程';
  if(!c||c.draft){th.innerHTML=newTaskHTML();return;}
  let html=c.turns.map((id,i)=>turnHTML(id,i,i===c.turns.length-1)).join('');
  (S.notices[c.id]||[]).forEach(n=>html+=msg('u','你','',`<div class="bubble">${esc(n.text)}</div>`)+msg('s','系统','未执行',`<div class="callout stop"><p>${esc(n.reason)}</p></div>`));
  if(S.error)html+=msg('s','系统','连接问题',`<div class="callout stop"><p>${esc(S.error)}</p></div>`);
  th.innerHTML=html;
  th.scrollTop=(atEnd||S._jump)?th.scrollHeight:pos;S._jump=false;
}
function newTaskHTML(){
  const p=picked();
  return `<div class="welcome"><h3>发起一个铺市任务</h3><p class="muted">选好产品和商圈，说清楚覆盖范围。人数和周期可以稍后补充，不影响先分析客户和策略。Agent 会判断目标渠道在商圈里有没有足够的门店，不够就自己去高德补采，再交给流水线排出首访名单和话术。</p>
  <div class="examples">${TEMPLATES(p).map(t=>`<button class="example" type="button" data-fill="${esc(t)}">${esc(t)}</button>`).join('')}</div>
  ${S.online?'':'<p class="small">这是离线页面：可以查看历史任务，新任务需要连接本地服务后发送。</p>'}</div>`;
}

/* ================= render: composer ================= */
function picked(){const ps=$('p-sel'),as=$('a-sel');const prof=S.profiles.find(x=>x.id===(ps?.value||'xinxian-huoquan'));
  return {product:prof?.name||'洞庭山·新鲜活泉',area:AREA[as?.value||'shishan']||'狮山'};}
function renderComposer(){
  const c=conv(),v=lastView(),running=v&&!DONE(v.status);
  const draft=!c||c.draft;
  $('pickers').hidden=!(draft&&S.online);
  if(draft&&S.online&&!$('p-sel')){
    $('pickers').innerHTML=`<label>产品 <select id="p-sel">${S.profiles.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label><label>商圈 <select id="a-sel">${S.areas.map(a=>`<option value="${esc(a.id)}">${esc(AREA[a.id]||a.id)}</option>`).join('')}</select></label>`;
    $('p-sel').value=S.profiles.some(p=>p.id==='xinxian-huoquan')?'xinxian-huoquan':S.profiles[0]?.id;$('a-sel').value='shishan';
    $('pickers').addEventListener('change',()=>renderThread());
  }
  let label='',items=[];
  if(draft){label='';items=[];}
  else if(running){label='';items=[];}
  else if(v?.status==='blocked'&&v.questions?.length){label='快速回答';items=answerChips(v);}
  else{const st=S.stage||'L1D';label=SNAME[st];items=FOLLOW[st]||[];}
  $('quick').hidden=!items.length;
  $('quick').innerHTML=items.length?`<span class="lab">${esc(label)}</span>`+items.map(q=>`<button class="pill" type="button" data-fill="${esc(q)}">${esc(q)}</button>`).join(''):'';
  $('ask').placeholder=draft?'例如：狮山商圈周边 3 公里推广新鲜活泉，先分析客户和策略':running?'执行中，结束后可以补充要求':'补充要求，或输入 / 打开百宝箱';
  $('ask').disabled=!!running;$('send').disabled=!!running||S.sending;$('tb').disabled=!!running;
  $('hint').textContent=!S.online?'离线页面：可以编辑和查看，发送需要连接本地服务':
    !S.config?.live_ready?`本地服务已连接，但实况配置缺少：${(S.config?.missing||[]).join('、')||'—'}`:
    draft?'发送后由 Agent 实时执行':running?'执行中…':'发送后在这个对话里继续执行';
  renderToolbox();
}
function toolboxItems(){
  const c=conv();
  if(!c||c.draft)return [['新任务模板',TEMPLATES(picked())]];
  return STAGES.filter(([id])=>FOLLOW[id]).map(([id,name])=>[name,FOLLOW[id]]);
}
function renderToolbox(){
  $('toolbox').hidden=!S.toolbox;$('tb').setAttribute('aria-expanded',S.toolbox);
  if(!S.toolbox)return;
  const f=$('ask').value.startsWith('/')?$('ask').value.slice(1).trim():'';let n=0;
  $('toolbox').innerHTML=toolboxItems().map(([g,list])=>{const items=list.filter(q=>!f||q.includes(f)||g.includes(f));
    return items.length?`<div class="tb-g"><h3>${esc(g)}</h3>${items.map(q=>`<button class="tb-i${n++===S.tbIndex?' on':''}" type="button" role="option" data-fill="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:'';}).join('')||'<p class="empty">没有匹配的指令</p>';
}

/* ================= render: artifacts ================= */
function renderArtifacts(){
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const v=lastView(),p=$('panel');
  if(!v||v.pending){p.innerHTML=`<div class="empty">${ICON.empty}<span>${conv()&&!conv().draft?'任务开始后显示商圈和产物':'任务执行后，这里显示地图、决策、名单和话术'}</span></div>`;return;}
  p.innerHTML={map:mapHTML,dec:decHTML,list:listHTML,pitch:pitchHTML}[S.tab](v)+`<div class="boundary">${(v.boundary||[]).map(b=>`<span>${esc(b)}</span>`).join('')}</div>`;
  if(S.tab==='dec'&&S.stage){const el=$('dec-'+S.stage);el?.scrollIntoView({block:'nearest'});}
}
function mapHTML(v){
  const R=v.brief?.radius_m||null,Rd=R||v.radius||3000,pad=Rd*1.06,shown=foundShown(v);
  const steps=S.replay?.id===lastId()?(v.steps||[]).slice(0,S.replay.k):(v.steps||[]);
  const lastInv=[...steps].reverse().find(s=>s.by_channel)?.by_channel;
  const ch=v.channels?.length?v.channels:(lastInv?Object.keys(lastInv).map(id=>({id,name:v.channel_names?.[id]||id})):[]);
  const zonesOn=!S.replay&&v.stages?.find(s=>s.id==='L2')?.done,termsOn=!S.replay&&v.stages?.find(s=>s.id==='L3')?.done;
  let svg=`<svg viewBox="${-pad} ${-pad} ${pad*2} ${pad*2}" role="img" aria-label="商圈地图"><defs><clipPath id="clip"><circle r="${Rd}"/></clipPath></defs><g clip-path="url(#clip)">`;
  for(let x=-Math.ceil(Rd/500)*500;x<=Rd;x+=500)svg+=`<line class="m-grid" x1="${x}" y1="${-Rd}" x2="${x}" y2="${Rd}"/><line class="m-grid" x1="${-Rd}" y1="${x}" x2="${Rd}" y2="${x}"/>`;
  if(zonesOn)for(const z of v.map.zones){const [x,y]=z.id.split(':').map(Number);svg+=`<rect class="m-zone" x="${x*500}" y="${-(y+1)*500}" width="500" height="500"/>`;}
  for(const [x,y] of v.map.base)svg+=`<circle class="m-base" cx="${x}" cy="${-y}" r="22"/>`;
  for(const f of v.map.found)if(shown.has(f.id))svg+=`<circle class="m-found" cx="${f.x}" cy="${-f.y}" r="38"><title>${esc(f.name)}（${esc(f.channel||'其他')}）</title></circle>`;
  if(termsOn)for(const t of v.terminals)if(t.grade!=='C')svg+=`<circle class="m-term ${t.grade}" cx="${t.x}" cy="${-t.y}" r="${t.grade==='A'?110:85}"><title>${t.grade} · ${esc(t.name)}</title></circle>`;
  svg+=`</g><circle class="m-ring${R?'':' tbd'}" r="${Rd}"/><circle class="m-ctr" r="55"/></svg>`;
  const counts=ch.length?`<div class="counts">${ch.map(c=>`<span>${esc(c.name)}<span class="num">${(lastInv&&lastInv[c.id]!=null)?lastInv[c.id]:(c.after??0)}</span></span>`).join('')}<span class="found">Agent 补采<span class="num">${shown.size}</span></span></div>`:'';
  const note=!R?'<div class="mapnote"><span>范围待立项确定，先按 3 公里显示</span></div>':'';
  return `${counts}<div class="legend"><span><i style="background:var(--dot)"></i>缓存商户 ${v.map.base.length}</span><span><i style="background:var(--found)"></i>Agent 补采</span>${termsOn?'<span><i style="border:2px solid var(--primary)"></i>首访终端</span>':''}${zonesOn?'<span><i style="background:var(--primary-soft);border:1px solid var(--primary);border-radius:2px"></i>选中网格 500 米</span>':''}<span>${R?`半径 ${+(R/1000).toFixed(1)} 公里`:''}</span></div><div class="mapwrap">${svg}${note}</div>`;
}
const lastId=()=>conv()?.turns.at(-1);
function foundShown(v){const steps=S.replay?.id===lastId()?(v.steps||[]).slice(0,S.replay.k):(v.steps||[]);const s=new Set();steps.forEach(x=>(x.added_ids||[]).forEach(i=>s.add(i)));if(!(v.steps||[]).some(x=>x.added_ids))v.map.found.forEach(f=>s.add(f.id));return s;}
function decHTML(v){
  const rows=(v.stages||[]).filter(s=>s.done||s.stopped||s.id===v.stopped_at);
  if(!rows.length)return `<div class="empty">${ICON.empty}<span>关卡完成后逐条列出决策和检查结果</span></div>`;
  const ST={passed:'通过',needs_review:'待复核',failed:'未通过',blocked:'阻断'};
  return `<ul class="dec">${rows.map(s=>`<li id="dec-${s.id}" class="${S.stage===s.id?'hl':''}"><div class="top"><span class="id">${s.id}</span><span class="nm">${esc(SNAME[s.id])}</span><span class="src ${s.judged_by==='模型'?'llm':''}">${s.judged_by==='模型'?'模型判断':'规则'}</span>${s.attempts>1?`<span class="src">尝试 ${s.attempts} 次</span>`:''}${s.review?`<span class="src">待复核 ${s.review} 项</span>`:''}</div>
    ${s.decision?`<p>${esc(s.decision)}</p>`:''}${(s.stopped||s.id===v.stopped_at)&&v.stop_reason?`<p style="color:var(--danger)">${esc(v.stop_reason)}</p>`:''}
    ${s.checks?.length?`<div class="checks">${s.checks.map(c=>`<span class="${c.status}">${esc(c.layer)}${c.status==='passed'?'':' '+(ST[c.status]||c.status)}</span>`).join('')}</div>`:''}</li>`).join('')}</ul>`;
}
function listHTML(v){
  if(!(v.terminals||[]).length)return `<div class="empty">${ICON.empty}<span>${DONE(v.status)?'这次任务没有走到「进哪家」':'执行到「进哪家」后显示首访名单'}</span></div>`;
  const g={A:0,B:0,C:0};v.terminals.forEach(t=>g[t.grade]++);
  return `<p class="small">共 ${v.terminals.length} 家 · A ${g.A} · B ${g.B} · C ${g.C}</p><div style="overflow-x:auto"><table><thead><tr><th>等级</th><th>门店</th><th>渠道</th><th>距中心</th><th>动作</th></tr></thead><tbody>${v.terminals.map(t=>`<tr class="${t.grade}"><td><span class="grade ${t.grade}">${t.grade}</span></td><td>${esc(t.name)}${t.found?'<span class="tagf">Agent 补采</span>':''}<div class="small">${esc(t.reason)}</div></td><td class="nowrap">${esc(t.channel)}</td><td class="nowrap num" style="font-weight:400">${t.distance??''} 米</td><td class="nowrap">${esc(t.action)}</td></tr>`).join('')}</tbody></table></div>`;
}
function pitchHTML(v){
  if(!(v.pitches||[]).length)return `<div class="empty">${ICON.empty}<span>${DONE(v.status)?'这次任务没有走到「怎么说」':'执行到「怎么说」后显示进店话术'}</span></div>`;
  return v.pitches.map(p=>`<div class="pitch"><h3>${esc(p.channel)}<span class="ok">${p.passed?'合规通过':'合规未通过'}</span></h3><p>${esc(p.pitch)}</p></div>`).join('');
}

/* ================= render all ================= */
function render(){renderList();renderHead();renderRail();renderThread();renderComposer();renderArtifacts();}

/* ================= actions ================= */
function select(id){showPane('chat');clearTimeout(S.timer);stopReplay(false);S.cur=id;S.stage=null;S.tab='map';S._jump=true;
  const c=conv();if(!c?.draft&&S.online){render();poll();}else render();
  if(!c?.draft){try{history.replaceState(null,'','#'+c.id);}catch{}}}
function newTask(){let d=S.convs.find(c=>c.draft);if(!d){d={id:'draft',draft:true};S.convs.unshift(d);}select(d.id);$('ask').focus();}
async function send(text){
  text=text.trim();if(!text||text.startsWith('/'))return;
  const c=conv();
  if(!S.online||!S.config?.live_ready){
    const reason=!S.online?'这是离线页面，没有连接 Agent 服务，这条指令没有执行。':`本地服务缺少实况配置（${(S.config?.missing||[]).join('、')}），这条指令没有执行。`;
    if(c&&!c.draft){(S.notices[c.id]=S.notices[c.id]||[]).push({text,reason});}
    else{alertDraft(reason);}
    $('ask').value='';S._jump=true;render();return;
  }
  S.sending=true;renderComposer();
  try{
    const body=taskRequestBody({conv:c,view:lastView(),text,profile:$('p-sel')?.value,area:$('a-sel')?.value});
    const {run_id}=await api('tasks',body);
    $('ask').value='';
    if(!c||c.draft){S.convs=S.convs.filter(x=>!x.draft);}
    await refreshList();
    const target=S.convs.find(x=>x.turns.includes(run_id));
    S.views[run_id]={pending:true,status:'queued',task:{message:text}};
    select(target?target.id:run_id);
  }catch(e){S.error=e.message;render();}
  finally{S.sending=false;renderComposer();}
}
function alertDraft(reason){const th=$('thread');th.insertAdjacentHTML('beforeend',msg('s','系统','未执行',`<div class="callout stop"><p>${esc(reason)}</p></div>`));}
function fill(t){$('ask').value=t;S.toolbox=false;autosize();renderToolbox();$('ask').focus();}
function autosize(){const a=$('ask');a.style.height='auto';a.style.height=Math.min(a.scrollHeight,120)+'px';}
function stopReplay(r=true){if(S.replay){clearTimeout(S.replay.timer);S.replay=null;if(r)render();}}
function startReplay(){
  const id=lastId(),v=S.views[id];if(!v?.steps?.length)return;
  if(S.replay){stopReplay();return;}
  S.replay={id,k:0};S.tab='map';S._jump=true;render();
  const tick=()=>{if(!S.replay)return;S.replay.k++;S._jump=true;render();
    if(S.replay.k<v.steps.length)S.replay.timer=setTimeout(tick,reduced?0:(v.steps[S.replay.k-1]?.kind==='model'?1400:1000));
    else S.replay.timer=setTimeout(()=>{S.replay=null;render();},reduced?0:900);};
  S.replay.timer=setTimeout(tick,reduced?0:600);
}

/* ================= events ================= */
function showPane(name){document.querySelector('.panes').dataset.show=name;document.querySelectorAll('[data-pane]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pane===name)));}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-pane],[data-fill],[data-tab],.task,.node,#newbtn,#replay,#tb,.note');
  if(!t){if(S.toolbox&&!e.target.closest('#toolbox')){S.toolbox=false;renderToolbox();}return;}
  if(t.matches('.note')){t.classList.toggle('open');return;}
  if(t.dataset.fill!=null)return fill(t.dataset.fill);
  if(t.dataset.pane)return showPane(t.dataset.pane);
  if(t.dataset.tab){showPane('art');S.tab=t.dataset.tab;renderArtifacts();return;}
  if(t.matches('.task'))return select(t.dataset.id);
  if(t.matches('.node')){showPane('art');S.stage=t.dataset.stage;S.tab='dec';renderRail();renderComposer();renderArtifacts();return;}
  if(t.id==='newbtn')return newTask();
  if(t.id==='replay')return startReplay();
  if(t.id==='tb'){S.toolbox=!S.toolbox;S.tbIndex=-1;renderToolbox();}
});
document.addEventListener('keydown',e=>{if(e.target.matches('.node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();}});
$('composer').addEventListener('submit',e=>{e.preventDefault();send($('ask').value);});
$('ask').addEventListener('input',()=>{autosize();const v=$('ask').value;if(v.startsWith('/')){S.toolbox=true;S.tbIndex=0;}else if(S.toolbox&&!v)S.toolbox=false;renderToolbox();});
$('ask').addEventListener('keydown',e=>{
  if(S.toolbox){const items=[...document.querySelectorAll('.tb-i')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.tbIndex=(S.tbIndex+(e.key==='ArrowDown'?1:-1)+items.length)%Math.max(items.length,1);renderToolbox();return;}
    if(e.key==='Enter'&&items[S.tbIndex]){e.preventDefault();fill(items[S.tbIndex].dataset.fill);return;}
    if(e.key==='Escape'){S.toolbox=false;renderToolbox();return;}}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit();}
});

/* ================= boot ================= */
async function boot(){
  if(location.protocol!=='file:'){
    try{
      const [config,profiles,areas]=await Promise.all([api('tasks/config'),api('profiles'),api('areas')]);
      Object.assign(S,{online:true,config,profiles,areas});await refreshList();
    }catch{S.online=false;}
  }
  if(!S.online)S.convs=offlineConvs();
  const want=decodeURIComponent(location.hash.slice(1)).replace(/^task\//,'');
  const hit=S.convs.find(c=>c.id===want||c.turns?.includes(want));
  if(hit)select(hit.id);else if(S.convs.length&&!S.online)select(S.convs[0].id);else if(S.convs.length)select(S.convs[0].id);else newTask();
}
boot();
})();
</script>
</body>
</html>
