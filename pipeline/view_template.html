<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>铺市 Agent 工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>

.side{display:grid;gap:var(--s4);align-content:start;min-width:0}.brand{display:grid;gap:var(--s1)}.brand b{font-size:var(--t-lg);font-weight:600}.newtask{height:var(--h-md);border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:var(--r-sm);text-align:left;padding:0 var(--s3)}.tasks{list-style:none;padding:0;margin:0;display:grid;gap:var(--s2);max-height:calc(100vh - 180px);overflow:auto}.task{width:100%;display:grid;gap:var(--s2);text-align:left;padding:var(--s3);border:0;border-left:3px solid transparent;background:transparent;border-radius:0 var(--r-sm) var(--r-sm) 0}.task:hover,.task[aria-current="true"]{background:var(--sunken)}.task[aria-current="true"]{border-left-color:var(--primary)}.task .t{font-size:var(--t-md);font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.task .m{display:flex;flex-wrap:wrap;gap:var(--s2);font-size:var(--t-xs);color:var(--muted);align-items:center}

p:wrap;gap:var(--s3)}.link{border:0;background:transparent;padding:0;color:var(--primary);font-size:var(--t-sm)}.running-bar{min-height:var(--h-md);padding:var(--s2) var(--s4);background:var(--primary-soft);color:var(--primary);font-size:var(--t-sm);font-variant-numeric:tabular-nums}.pending-dots span{display:inline-block;animation:dot 1.2s infinite}.pending-dots span:nth-child(2){animation-delay:.2s}.pending-dots span:nth-child(3){animation-delay:.4s}

.tabs{display:flex;gap:var(--s1);background:var(--sunken);border-radius:var(--r-sm);padding:var(--s1)}.tab{height:var(--h-sm);border:0;border-radius:var(--r-sm);background:transparent;padding:0 var(--s2);font-size:var(--t-sm);color:var(--ink-2)}.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}.panel{padding:var(--s4);display:grid;gap:var(--s4);min-width:0}.counters{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:baseline}.ctr{display:flex;gap:var(--s1);align-items:baseline}.ctr:not(:last-child):after{content:'·';color:var(--muted);margin-left:var(--s2)}.ctr .v{font-size:var(--t-lg)}.ctr .v small{display:none}.ctr.total .v{color:var(--found)}.map{display:block;width:100%;aspect-ratio:1;max-height:min(60vh,560px)}.map .ring{fill:none;stroke:var(--line-strong);stroke-width:2;vector-effect:non-scaling-stroke}.map .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}.map .base{fill:var(--idle)}.map .found{fill:var(--found)}.map .zone{fill:var(--primary-soft);stroke:var(--primary);stroke-width:1.5;vector-effect:non-scaling-stroke}.map .term{fill:none;stroke:var(--primary);stroke-width:2;vector-effect:non-scaling-stroke}.map .centre{fill:var(--ink)}.map text{fill:var(--muted);font:160px var(--font)}.legend{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:var(--s2);font-size:var(--t-xs);color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:var(--s1)}.dec{list-style:none;margin:0;padding:0}.dec li{display:grid;gap:var(--s2);padding:var(--s4) 0;border-bottom:1px solid var(--line)}.dec li:first-child{padding-top:0}.dec li.hl{background:var(--primary-soft)}.dec .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s2)}.dec .top b{font-family:var(--mono);font-size:var(--t-xs)}.lay{display:flex;flex-wrap:wrap;gap:var(--s2)}.lay span{font-size:var(--t-xs);color:var(--muted)}.lay span:before{content:'●';font-size:var(--t-xs);margin-right:var(--s1)}.lay .passed{color:var(--ok)}.lay .needs_review{color:var(--found)}.lay .failed,.lay .blocked{color:var(--danger)}.jb{font-size:var(--t-xs);color:var(--muted)}.jb.m{color:var(--found)}.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:var(--t-md)}th,td{text-align:left;padding:var(--s2);border-bottom:1px solid var(--line);vertical-align:top}th{font-size:var(--t-xs);font-weight:400;color:var(--muted)}.grade{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:var(--r-sm);font-family:var(--mono);font-size:var(--t-xs);background:var(--line-strong)}.A .grade{background:var(--ink);color:var(--surface)}.C{color:var(--muted)}.C .grade{background:transparent;border:1px solid var(--line-strong)}.chip{font-size:var(--t-xs);color:var(--found);display:inline-block;margin-left:var(--s1)}.pitch{display:grid;gap:var(--s2);padding:var(--s4) 0;border-bottom:1px solid var(--line)}.pitch blockquote{margin:0;max-width:62ch;line-height:1.75}.okt{color:var(--ok);font-size:var(--t-xs)}.empty{padding:var(--s5) 0;color:var(--muted)}footer{max-width:1600px;margin:var(--s5) auto 0;color:var(--muted);font-size:var(--t-xs)}footer ul{margin:var(--s2) 0;padding-left:var(--s4)}.ghost{background:transparent;border:0;color:var(--primary);font-size:var(--t-xs);padding:var(--s1)}.art-mobile{display:none}.sample{font-size:var(--t-xs);color:var(--muted)}.sample ul{padding-left:var(--s4);max-height:180px;overflow:auto}

<body>
<div class="app">
  <aside class="side" aria-label="任务">
    <div class="brand"><b>铺市 Agent</b><span class="label">新品进店 · 市场开发策略</span></div>
    <button class="newtask" id="newtask" type="button">＋ 新建任务</button>
    <span class="label">任务记录</span>
    <ol class="tasks" id="tasks"></ol>
  </aside>

  <main class="work">
    <div class="head">
      <h1 id="h1"></h1>
      <div class="meta" id="meta"></div><button class="ghost art-mobile" type="button" onclick="document.querySelector('.panes').classList.toggle('show-art')">对话 / 产物</button>
    </div>
    <ol class="rail" id="rail" aria-label="关卡（点击查看该关的决策与快捷指令）"></ol>

    <div class="panes">
      <section class="card chat" aria-labelledby="chat-h">
        <div class="card-h"><h2 id="chat-h">对话</h2><div style="display:flex;gap:8px;align-items:center"><span class="label" id="agent-meta"></span><button class="ghost" id="replay" type="button">回看执行过程</button></div></div>
        <div class="running-bar" id="running-bar" role="status" hidden></div>
        <ol class="thread" id="thread" aria-live="polite"></ol>
        <form class="composer" id="composer" autocomplete="off">
          <div class="toolbox" id="toolbox" hidden aria-label="百宝箱"></div>
          <div class="task-options" id="task-options" hidden><label>产品 <select id="product-select"></select></label><label>商圈 <select id="area-select"></select></label></div><div class="quick" id="quick"></div>
          <div class="row">
            <button class="tb-btn" id="tb" type="button" aria-expanded="false" aria-controls="toolbox">百宝</button>
            <textarea id="ask" rows="2" aria-label="给 Agent 的指令" placeholder="补充要求，或输入 / 打开百宝箱"></textarea>
            <button class="send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 3 17 9-17 9 3-9-3-9Z M7 12h14"/></svg></button>
          </div>
          <span class="hint" id="hint"></span>
        </form>
      </section>

      <section class="card" aria-labelledby="art-h">
        <div class="card-h"><h2 id="art-h">产物</h2>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" id="tab-map" aria-controls="p-map" aria-selected="true" type="button">地图</button>
            <button class="tab" role="tab" id="tab-dec" aria-controls="p-dec" aria-selected="false" type="button">决策</button>
            <button class="tab" role="tab" id="tab-term" aria-controls="p-term" aria-selected="false" type="button">名单</button>
            <button class="tab" role="tab" id="tab-pitch" aria-controls="p-pitch" aria-selected="false" type="button">话术</button>
          </div>
        </div>
        <div class="panel" id="p-map" role="tabpanel" aria-labelledby="tab-map">
          <div class="counters" id="counters"></div>
          <div class="legend"><span><i style="background:var(--dot)"></i>原有缓存</span><span><i style="background:var(--found)"></i>Agent 补采</span><span><i style="border:2px solid var(--water)"></i>首访终端</span><span><i style="background:var(--water-soft);border-radius:2px;border:1px solid var(--water)"></i>选中网格（500 米）</span></div>
          <svg class="map" id="map" viewBox="-3300 -3300 6600 6600" role="img" aria-label="商圈地图：灰点为原有缓存商户，橙点为 Agent 补采商户，蓝框为选中网格"></svg>
          <span class="label" id="map-meta"></span>
        </div>
        <div class="panel" id="p-dec" role="tabpanel" aria-labelledby="tab-dec" hidden><ol class="dec" id="dec"></ol></div>
        <div class="panel" id="p-term" role="tabpanel" aria-labelledby="tab-term" hidden><span class="label" id="t-meta"></span><div class="tbl"><table><thead><tr><th>等级</th><th>门店</th><th>渠道</th><th>距中心</th><th>理由</th><th>动作</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
        <div class="panel" id="p-pitch" role="tabpanel" aria-labelledby="tab-pitch" hidden><div id="pitches"></div></div>
      </section>
    </div>
  </main>
</div>
<footer><span class="label">如实说明</span><ul id="boundary"></ul></footer>

<script>
const DATA=/*__DATA__*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS='http://www.w3.org/2000/svg';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Presentation labels from profiles/*.yaml; no inference or additional API requests.

const tasks=DATA.tasks.map(t=>({...t,draft:false,extra:[]}));

/* ---------- task list ---------- */
const fmt=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});};
const areaName=v=>({shishan:'狮山',guanqian:'观前街',ligongdi:'李公堤'})[v]||v||'待选商圈';
const taskTitle=t=>t.draft?'新任务':`${t.product||'待选产品'} · ${areaName(t.area)} · 找终端`;
function statusChip(t){
 if(t.draft)return '<span class="st-chip draft">草稿</span>';
 if(!t.status)return '';
 const state=t.status, stage=t.current_stage||t.stopped_at;
 const style={queued:'queue',running:'run',gate_pending:'wait',completed:'done',blocked:'stop',failed:'error',stopped:'stop'}[state];
 const text={queued:'排队中',running:'执行中'+(stage?' · '+(STAGE_NAMES[stage]||'处理任务'):''),gate_pending:'等你补充',completed:'已完成',blocked:t.questions?.length?'等你补充':stage?'停在 '+stage:'已停止',failed:'出错',stopped:stage?'停在 '+stage:'已停止'}[state];
 return text?`<span class="st-chip ${t.questions?.length&&state==='blocked'?'wait':style}">${esc(text)}</span>`:'';
}
function renderMeta(){
 $('h1').textContent=taskTitle(T);
 $('meta').innerHTML=`${statusChip(T)}${T.created_at?`<time>${fmt(T.created_at)}</time>`:''}${T.mode?`<span>${esc(T.mode)}</span>`:''}${T.model?`<span>模型 ${esc(T.model)}</span>`:T.draft?'':'<span>未记录模型名称</span>'}`;
 updateRunning();
}
function updateRunning(stage){
 const bar=$('running-bar'), active=playing||T.status==='running';bar.hidden=!active;
 if(!active)return;
 const current=stage||T.current_stage||T.stages.find(s=>!s.done)?.id;
 const duration=T.created_at&&!playing?Math.max(0,Math.floor((Date.now()-new Date(T.created_at))/1000)):null;
 const elapsed=duration!==null&&Number.isFinite(duration)?` · ${String(Math.floor(duration/60)).padStart(2,'0')}:${String(duration%60).padStart(2,'0')}`:'';
 bar.textContent=`● ${playing?'回放：':'正在：'}${STAGE_NAMES[current]||'准备任务'} · 已调用工具 ${playing?thinkLog?.querySelectorAll('.who.tool').length||0:T.steps.filter(s=>s.kind==='tool').length} 次${elapsed}`;
}
function renderTasks(){
  $('tasks').innerHTML=tasks.map((t,i)=>`<li><button class="task" type="button" data-i="${i}" aria-current="${i===cur}"><span class="t">${esc(taskTitle(t))}</span><span class="m">${statusChip(t)}<span>${t.draft?'未执行':fmt(t.created_at)}</span>${!t.draft&&t.model?`<span>${esc(t.model)}</span>`:''}${!t.draft&&t.counts&&t.counts.added?`<span>补采 ${t.counts.added}</span>`:''}</span></button></li>`).join('');

}

/* ---------- open a task ---------- */
let T,foundEls,termEls,zoneEls;
function open(){
  T=tasks[cur];renderTasks();
  renderMeta();

  $('replay').hidden=T.draft||!T.stages.length;
  $('boundary').innerHTML=(T.boundary||[]).map(b=>`<li>${esc(b)}</li>`).join('');
  $('hint').textContent=T.draft?'这是离线页面：可以编辑指令，执行需要连接本地 Agent 服务。':'历史任务：可继续追问（需要连接本地 Agent 服务才能执行）。输入 / 打开百宝箱。';

/* rail */
function renderRail(){
  const st=T.stages.length?T.stages:Object.keys(STAGE_NAMES).map(id=>({id,name:STAGE_NAMES[id],summary:'',agent:id==='L1D'}));
  $('rail').innerHTML=st.map(s=>`<li class="st${s.agent?' agent':''}" id="st-${s.id}" data-s="${s.done?'done':s.stopped?'stop':T.status==='running'&&T.current_stage===s.id?'run':'idle'}" tabindex="0" role="button"><span class="id" aria-label="${s.id}">${s.id}</span><span class="nm">${esc(STAGE_NAMES[s.id]||s.name)}${s.agent?'<span class="tag">Agent</span>':''}</span>${s.summary&&s.summary!=='—'&&!s.summary.includes('None')?`<span class="sm">${esc(s.summary.replaceAll('—','待检查'))}</span>`:''}</li>`).join('');
  st.forEach(s=>{const e=$('st-'+s.id);const go=()=>selectStage(s.id,true);e.addEventListener('click',go);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go();}});});
}
const setStage=(id,state)=>{const e=$('st-'+id);if(e)e.dataset.s=state;if(state==='run')updateRunning(id);};
function selectStage(id,jump){
  selStage=id;document.querySelectorAll('.st').forEach(e=>e.classList.toggle('sel',e.id==='st-'+id));
  renderQuick();
  if(jump&&T.stages.length){tab('dec');document.querySelectorAll('.dec li').forEach(x=>x.classList.toggle('hl',x.id==='dec-'+id));$('dec-'+id)?.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'});}
}

/* map */
function renderMap(){
  const svg=$('map');svg.innerHTML='';const R=T.radius||3000;foundEls=new Map();zoneEls=[];termEls=[];
  const el=(tag,attrs,parent=svg)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;};
  const tip=(n,t)=>{const x=document.createElementNS(NS,'title');x.textContent=t;n.appendChild(x);};
  if(T.draft||!T.stages.some(s=>s.id==='L0'&&s.done)){
   el('text',{x:0,y:0,'text-anchor':'middle'}).textContent='立项完成后显示范围';
   $('map-meta').textContent='范围尚未确定，等待立项完成。';counters(null,0);return;
  }
  svg.setAttribute('viewBox',`${-R*1.2} ${-R*1.2} ${R*2.4} ${R*2.4}`);
  const pixel=R*2.4/Math.min(svg.clientWidth||480,560,innerHeight*.6);
  const clip=el('clipPath',{id:'c'});el('circle',{cx:0,cy:0,r:R},clip);
  const g=el('g',{'clip-path':'url(#c)'});
  for(let v=-Math.ceil(R/500)*500;v<=R;v+=500){el('line',{x1:v,y1:-R,x2:v,y2:R,class:'grid'},g);el('line',{x1:-R,y1:v,x2:R,y2:v,class:'grid'},g);}
  zoneEls=T.map.zones.map(z=>{const [x,y]=z.id.split(':').map(Number);return el('rect',{x:x*500,y:-(y+1)*500,width:500,height:500,class:'zone'});});
  el('circle',{cx:0,cy:0,r:R,class:'ring'});
  for(const [x,y] of T.map.base)el('circle',{cx:x,cy:-y,r:2.5*pixel,class:'base'});
  foundEls=new Map(T.map.found.map(p=>{const c=el('circle',{cx:p.x,cy:-p.y,r:4*pixel,class:'found'});tip(c,`${p.name}（${p.channel||'其他'}）`);return [p.id,c];}));
  termEls=T.terminals.filter(t=>t.grade!=='C').map(t=>{const c=el('circle',{cx:t.x,cy:-t.y,r:t.grade==='A'?90:70,class:'term '+t.grade});tip(c,`${t.grade} · ${t.name}`);return c;});
  el('circle',{cx:0,cy:0,r:45,class:'centre'});
  if(!T.draft)el('text',{x:R,y:-R-100,'text-anchor':'end',style:`font-size:${12*pixel}px`}).textContent=`半径 ${R/1000} km`;
  $('map-meta').textContent=T.draft?'任务执行后在这里显示商圈、补采门店和选区。':`${T.map.base.length} 家缓存 · Agent 补采 ${T.map.found.length} 家 · 选中 ${T.map.zones.length} 个网格`;
  counters(T.steps.length?T.steps.reduce((a,s)=>s.by_channel||a,null):null,T.map.found.length);
}
function counters(by,added){
  const profile=T.draft?$('product-select').value:T.task?.profile||PROFILE_NAMES[T.product];
  const ch=PROFILE_CHANNELS[profile]||T.channels.length&&T.channels||(T.targets||[]).map(n=>({id:n,name:n}));
  $('counters').innerHTML=ch.map(c=>`<div class="ctr"><span class="label">${esc(c.name)}</span><span class="v">${by?.[c.id]??0}<small> 家</small></span></div>`).join('')+
   `<div class="ctr total"><span class="label">Agent 补采</span><span class="v">${added}<small> 家</small></span></div>`;
}

  $('dec').innerHTML=T.stages.length?T.stages.map(s=>`<li id="dec-${s.id}"><div class="top"><b>${s.id}</b><span>${esc(s.name)}</span>${s.judged_by?`<span class="jb ${s.judged_by==='模型'?'m':''}">${esc(s.judged_by)}判断</span>`:''}<span class="label">${s.attempts?`尝试 ${s.attempts} 次`:'未执行'}${s.review?` · 待复核 ${s.review} 项`:''}${s.approved?` · ${s.approved==='auto (demo)'?'自动放行（演示）':'人工确认'}`:''}</span></div>${s.decision?`<p>${esc(s.decision)}</p>`:''}${s.stopped&&T.stop_reason?`<p style="color:var(--stop)">停止原因：${esc(T.stop_reason)}</p>`:''}${s.summary&&s.summary!=='—'?`<p class="label">${esc(s.summary.replaceAll('None','待补充').replaceAll('—','待检查'))}</p>`:''}${s.checks.length?`<div class="lay">${s.checks.map(c=>`<span class="${c.status}">${esc(c.layer)} ${ST[c.status]||'尚未检查'}</span>`).join('')}</div>`:''}</li>`).join(''):'<li class="empty">任务执行后，这里逐关列出决定、判断来源和检查结果。</li>';

/* ---------- conversation ---------- */
const ARG={keywords:'关键词',types:'类型码',max_pages:'页数',channel_id:'渠道',category:'类别',type_prefix:'类型前缀',page:'页'};
function stepHTML(s){
  if(s.kind==='model')return `<span class="who model">行动</span><div class="lbody"><span class="h">${s.calls.length?'调用 '+esc(s.calls.join('、')):'给出结论'}</span>${s.note?`<details class="note"><summary>思考内容 · 展开全文</summary><div>${esc(s.note)}</div></details>`:''}</div>`;
  if(s.kind==='rejected')return `<span class="who rej">打回</span><div class="lbody"><span class="h">代码复核未通过，要求重写</span><span class="note">${esc(s.problems.join('；'))}</span></div>`;
  const a=Object.entries(s.args).map(([k,v])=>`<span class="arg">${esc(ARG[k]||k)} ${esc(v)}</span>`).join('');
  let r='';
  if(!s.ok)r=`<span class="res" style="color:var(--stop)">${esc(s.error)}</span>`;
  else if(s.tool==='search_merchants')r=`<span class="res">返回 <b>${s.returned}</b> 条 · 新增 <b>${s.new}</b> 家</span>`;
  else if(s.by_channel)r=`<span class="res">${s.by_category?Object.entries(s.by_category).map(([k,v])=>`${CAT[k]||k} ${v}`).join('、')+' → ':''}${T.channels.map(c=>`${esc(c.name)} <b>${s.by_channel[c.id]??0}</b>`).join(' · ')}</span>`;
  else if(s.total!=null)r=`<span class="res">${s.total} 条</span>`;
  return `<span class="who tool">工具</span><div class="lbody"><span class="h">${esc(s.label)}</span>${a?`<div class="args">${a}</div>`:''}${r}${s.sample?.length?`<details class="sample"><summary>查看返回的商户（${s.sample.length} 条样例）</summary><ul>${s.sample.map(p=>`<li>${esc(p.name)} · ${esc(p.distance_m)} 米</li>`).join('')}</ul></details>`:''}</div>`;
}
function msg(kind,who,meta,inner){const li=document.createElement('li');li.className='msg '+kind;const av={user:['u','你'],agent:['a','A'],pipe:['p','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>'],sys:['s','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 6v2"/></svg>']}[kind];li.innerHTML=`<span class="av ${av[0]}">${av[1]}</span><div class="mbody"><span class="who-line"><b>${who}</b>${meta||''}</span><div class="bubble">${inner}</div></div>`;$('thread').appendChild(li);return li;}

function pendingStep(){
 if(!thinkLog)return;const active=playing||T.status==='running';let dots=thinkLog.parentElement.querySelector('.pending-dots');
 if(!active){dots?.remove();return;}if(!dots){dots=document.createElement('div');dots.className='pending-dots';dots.setAttribute('aria-label','正在执行');dots.innerHTML='<span>·</span><span>·</span><span>·</span>';thinkLog.after(dots);}

function agentAnswer(){msg('agent','Agent','<span>结论 · 代码复核通过</span>',`<p>${esc(T.decision)}</p><p class="label">补采后：${T.channels.map(c=>`${esc(c.name)} ${c.after} 家`).join(' · ')}</p>`);}

}
function extras(){for(const e of T.extra){msg('user','你','<span>追问</span>',`<p>${esc(e)}</p>`);offlineNotice();}}
function offlineNotice(){msg('sys','系统','<span>未执行</span>','<p>这是离线页面，没有连接 Agent 服务，这条指令没有被执行，也不会生成回复。</p><p class="label">要执行：在本地启动服务，连接后从这里发送；或在命令行运行 <span class="mono">uv run python -m pipeline demo --mode live</span>。</p>');}
function renderThread(){
  $('thread').innerHTML='';
  const current=T;
  for(const previous of current.previousTurns||[]){
    T=previous;userMsg();
    if(T.steps?.length)msg('agent','Agent','<span>本轮执行记录</span>',`<details class="think"><summary>查看 ${T.steps.length} 步行动与工具调用</summary><ol class="log">${T.steps.map(stepHTML).map(html=>'<li>'+html+'</li>').join('')}</ol></details>`);
    pipelineMsg();
  }
  T=current;
  if(T.pending){msg('pipe','工作台','','<p>正在加载这条任务的执行记录与产物…</p>');return;}
  if(T.draft){msg('pipe','Agent 工作台','',`<p>告诉我要推广什么产品、去哪个区域、有几个人和多长时间。也可以从下面的百宝箱选一条开始。</p>`);extras();return;}
  userMsg();
  if(T.steps.length){agentStart();T.steps.forEach(addStep);if(T.decision)agentAnswer();if(['completed','blocked','failed'].includes(T.status))thinkLog.closest('details').open=false;}
  if(['completed','blocked','failed'].includes(T.status))pipelineMsg();else msg('pipe','执行中','','<p>正在处理任务，工具结果会继续更新。</p>');extras();
  zoneEls.forEach(z=>z.style.visibility='visible');termEls.forEach(t=>t.style.visibility='visible');
  $('thread').scrollTop=0;
}

/* ---------- composer + toolbox ---------- */
function renderQuick(){
 const quick=[['查找门店','L1D'],['选区','L2'],['写话术','L4'],['作战包','PACK']];
 $('quick').innerHTML=quick.map(([label,id])=>`<button class="qp" type="button" data-stage="${id}">${label}</button>`).join('');
 $('quick').querySelectorAll('.qp').forEach(b=>b.addEventListener('click',()=>fill(TOOLBOX[b.dataset.stage][0])));
}
function renderToolbox(filter=''){
  const f=filter.trim();
  $('toolbox').innerHTML=Object.entries(TOOLBOX).map(([id,list])=>{const items=list.filter(q=>!f||q.includes(f)||STAGE_NAMES[id].includes(f));return items.length?`<div class="tb-group"><h3>${esc(STAGE_NAMES[id])} <span>${id}</span></h3>${items.map(q=>`<button class="qp" type="button">${esc(q)}</button>`).join('')}</div>`:'';}).join('')||'<p class="empty">没有匹配的快捷指令</p>';
  $('toolbox').querySelectorAll('.qp').forEach(b=>b.addEventListener('click',()=>{fill(b.textContent);toggleBox(false);}));
}
function toggleBox(on,filter=''){$('toolbox').hidden=!on;$('tb').setAttribute('aria-expanded',on);if(on)renderToolbox(filter);}
function fill(text){$('ask').value=text;$('ask').focus();}
$('tb').addEventListener('click',()=>toggleBox($('toolbox').hidden));
$('ask').addEventListener('input',e=>{const v=e.target.value;if(v.startsWith('/'))toggleBox(true,v.slice(1));else if(!$('toolbox').hidden&&!v)toggleBox(false);});
$('ask').addEventListener('keydown',e=>{if(e.key==='Escape')toggleBox(false);if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('composer').requestSubmit();}});
document.addEventListener('click',e=>{if(!$('toolbox').hidden&&!e.target.closest('#toolbox,#tb,#ask'))toggleBox(false);});
$('composer').addEventListener('submit',e=>{
  e.preventDefault();const text=$('ask').value.trim();if(!text||text.startsWith('/'))return;
  if(window.startConnectedTask){window.startConnectedTask(text);return;}
  T.extra.push(text);if(T.draft){renderTasks();}
  msg('user','你',`<span>${T.draft?'任务':'追问'}</span>`,`<p>${esc(text)}</p>`);offlineNotice();
  $('ask').value='';toggleBox(false);$('thread').scrollTop=$('thread').scrollHeight;
});

/* ---------- 回看执行过程（历史任务的逐步重现） ---------- */
let followThread=true;$('thread').addEventListener('scroll',()=>{const e=$('thread');followThread=e.scrollHeight-e.scrollTop-e.clientHeight<80;});
const wait=ms=>new Promise(r=>{timer=setTimeout(r,reduced?0:ms);});
function stopPlay(){if(playing){playing=false;clearTimeout(timer);pendingStep();updateRunning();$('replay').textContent='回看执行过程';}}
async function replay(){
  if(playing){stopPlay();open();return;}
  followThread=true;playing=true;updateRunning();$('replay').textContent='停止';
  T.stages.forEach(s=>setStage(s.id,'idle'));zoneEls.forEach(z=>z.style.visibility='hidden');termEls.forEach(t=>t.style.visibility='hidden');foundEls.forEach(c=>c.style.visibility='hidden');counters(null,0);tab('map');
  $('thread').innerHTML='';userMsg();await wait(800);
  for(const s of T.stages){
    if(!playing)return;setStage(s.id,'run');
    if(s.agent&&T.steps.length){agentStart();for(const step of T.steps){await wait(step.kind==='model'?1500:1000);if(!playing)return;addStep(step);if(followThread)$('thread').scrollTop=$('thread').scrollHeight;}await wait(700);if(!playing)return;if(T.decision)agentAnswer();}
    else await wait(500);
    if(!playing)return;setStage(s.id,s.done?'done':s.stopped?'stop':'idle');
    if(s.id==='L2')zoneEls.forEach(z=>z.style.visibility='visible');
    if(s.id==='L3')termEls.forEach(t=>t.style.visibility='visible');
    if(s.stopped)break;
  }
  await wait(400);if(!playing)return;pipelineMsg();extras();if(followThread)$('thread').scrollTop=$('thread').scrollHeight;
  playing=false;pendingStep();updateRunning();if(thinkLog)thinkLog.closest('details').open=false;$('replay').textContent='回看执行过程';
}
$('replay').addEventListener('click',replay);

open();
</script>
