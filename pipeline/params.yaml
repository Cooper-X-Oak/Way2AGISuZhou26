version: 3
competition:
  rank_shares: {low: 0.3333333333333333, medium: 0.3333333333333333, high: 0.3333333333333333}
  strategies: {低: 补位, 中: 正面, 高: 避让}
  p1_top_share: 0.3333333333333333
  high_p1_strategy: 正面
  retail_typecodes: {便利店: ['060200'], 商超: ['0601', '0604']}
  typecode_source: https://a.amap.com/lbs/static/code_resource/Amap_poicode.zip
  source: 项目假设；饮品可得性为品牌点位与便利店及商超的去重计数（多品牌同一POI按品牌名排序归首项，仅计一次），代理指标，非竞品实测；仅以本run选中网格为排名参照，升序首位排名三分位，同值同档（可不均分）；非选中网格只投影到该参照；P1正计数降序首位排名前1/3时高竞争改正面
partners:
  search_radius_m: 5000
  coverage_radius_m: 2000
  max_recommended_per_zone: 3
  eligible_types: [酒水批发, 餐饮供应链, 品牌自有网点]
  retail_exclusion:
    keywords: [超市, 便利店, 商场, 购物中心, 百货]
    typecode_prefixes: ['0601', '0602', '0604']
    source: 项目伙伴分类规则；名称或类型显示零售业态时归其他，不作为供货方推荐，优先于烟酒类型和品牌关键词
  source: 项目假设；5公里候选搜索、2000米球面供货半径；每选中网格按新增A/B覆盖数贪心推荐最多3家，平局按距网格中心距离再poi_id；零新增覆盖停止；供货资质未确认
  classification:
    - {kind: 品牌自有网点, keywords: [洞庭山泉], typecodes: []}
    - {kind: 餐饮供应链, keywords: [餐饮供应链, 食材配送, 食材, 食品配送], typecodes: []}
    - {kind: 酒水批发, keywords: [酒水批发, 烟酒副食批发, 酒水, 烟酒, 副食], typecodes: ['061210']}
  queries:
    - {keyword: 酒水批发, types: '', role: partner}
    - {keyword: 烟酒副食批发, types: '', role: partner}
    - {keyword: 餐饮供应链, types: '', role: partner}
    - {keyword: 食材配送, types: '', role: partner}
    - {keyword: 洞庭山泉, types: '', role: partner}
    - {keyword: '', types: '061210', role: partner}
  typecode_source: https://a.amap.com/lbs/static/code_resource/Amap_poicode.zip ; 061210烟酒专卖店仅为候选，不证明批发资质；关键词不加类型过滤避免漏查
note: 所有排序和执行数值是项目假设，非行业统计；来源 params.yaml，执行前固定。
execution:
  visits_per_person_day: {default: 20, source: 项目执行假设，待经销商校准}
  workdays_week: {default: 5, source: 项目执行假设，待经销商校准}
priority_weights: {P1: 1.0, P2: 0.65, P3: 0.3, excluded: 0.0}
priority_cutoffs: {P1: 0.8, P2: 0.6, P3: 0.3}
max_selected_zones: 4
min_terminals_per_zone: 1
max_backtracks: 2
confidence_threshold: 0.7
budget: {amap_calls: 80}
scoring:
  grade_shares: {A: 0.2, B: 0.3, C: 0.5}
  rank_rule: score降序、distance_m升序、poi_id升序；累计分位边界向上取整；封顶后不补位
  component_weights: {channel_weight: 0.4, zone_rank: 0.2, distance_decay: 0.25, data_completeness: 0.15}
  source: 项目排序假设，执行前固定；非销量预测
first_visits_per_day: 10
amap_classification:
  typecode_subtypes: {'050119': 海鲜, '050117': 火锅, '050101': 酒楼, '050107': 酒楼, '050300': 简餐}
  type_keywords: [海鲜, 火锅, 烧烤, 烤肉, 酒楼, 酒家, 夜宵, 宵夜]
  subtype_aliases: {江浙菜: 酒楼, 苏帮菜: 酒楼, 本帮菜: 酒楼, 淮扬菜: 酒楼, 苏菜: 酒楼, 河鲜: 海鲜}
  name_subtypes: {苏帮菜: 酒楼, 本帮菜: 酒楼, 淮扬菜: 酒楼, 江浙菜: 酒楼, 海鲜: 海鲜, 河鲜: 海鲜}
  named_restaurants:
    - {name: 得月楼, subtype: 酒楼, source: '.work/tasks/data-quality.md#发现1；任务明确指出的苏帮菜老字号；仅匹配店名及括号分店后缀，不凭楼字推断'}
  source: 项目映射假设（Issue 12）；高德type明确子类型优先，再050107江浙菜等类型码，再名称明确菜系关键词与档案规则；地方正餐菜系暂归酒楼宴席，不证明宴会能力或老字号身份；050100中餐厅与050118特色中餐厅保持待核实；不推断营业时段
sources:
  first_visits_per_day: 项目首访容量假设；每人每天10家，每周5天，执行前固定
  priority_weights: 项目渠道排序假设，待品牌方校准
  priority_cutoffs: 项目规则版依据档案rules_fit分档的假设，待品牌方校准
  max_selected_zones: 项目地推聚焦上限假设
  min_terminals_per_zone: 项目最低可访终端数假设
  max_backtracks: market-entry-v2任务限制
  confidence_threshold: 项目人工复核阈值假设
  budget: market-entry-v2任务默认预算
